<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор Fiege</title>
    <style>
        :root {
            --primary: #e3000f; 
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e5ec;
            --success: #27ae60;
            --highlight: #fff3cd;
        }

        [data-theme="dark"] {
            --primary: #ff4d57;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --success: #2ecc71;
            --highlight: #332b00;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .calculator { 
            width: 100%;
            max-width: 420px; 
            background: var(--panel-bg); 
            padding: 24px 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
            box-sizing: border-box;
            position: relative;
            transition: background 0.3s;
        }

        .menu-btn, .close-menu {
            background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-main); padding: 0;
        }

        .side-menu {
            position: absolute; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--panel-bg); box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            border-radius: 16px 0 0 16px; z-index: 10; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; transition: transform 0.3s ease;
            transform: translateX(-100%); overflow-y: auto;
        }
        .side-menu.open { transform: translateX(0); }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .menu-item { margin-bottom: 15px; }
        .menu-item label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; width: 100%; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h2 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; }

        .form-group { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        
        .form-group.sub-group {
            background: var(--highlight);
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: -6px;
            margin-bottom: 14px;
            border: 1px dashed var(--text-muted);
        }

        label { font-size: 14px; font-weight: 500; color: var(--text-main); width: 60%; }
        .sub-group label { font-size: 13px; font-weight: 600; }

        input, select { 
            width: 38%; padding: 10px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 14px; text-align: center; 
            background: var(--bg-color); color: var(--text-main);
            font-weight: 600; box-sizing: border-box; appearance: none;
        }
        
        select {
            text-align-last: center; padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237f8c8d%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.1); }
        input::placeholder { color: var(--text-muted); font-weight: 400; }

        .divider { border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        .results-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .result-box { border-radius: 12px; padding: 16px 12px; text-align: center; }
        .result-box.brutto { background: var(--bg-color); border: 1px solid var(--border-color); }
        .result-box.netto { background: rgba(39, 174, 96, 0.08); border: 1px solid var(--success); }
        .result-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; }
        .result-value { font-size: 20px; font-weight: 800; }
        .brutto .result-value { color: var(--text-main); }
        .netto .result-value { color: var(--success); }

        .hidden { display: none !important; }
        .action-btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sync { background: var(--success); }
        .btn-auth-action { background: var(--primary); }
        .btn-logout { background: var(--text-muted); }
        .cloud-section { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="calculator">
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span id="menuTitle" style="font-size: 15px; font-weight: bold;">Меню</span>
            <button class="close-menu" onclick="toggleMenu()">✕</button>
        </div>

        <div class="menu-item">
            <label id="lblMenuLang">Мова</label>
            <select id="langSelect" style="width: 100%;" onchange="setLang(this.value)">
                <option value="ua">Українська</option>
                <option value="pl">Polski</option>
            </select>
        </div>

        <div class="menu-item">
            <label id="lblMenuTheme">Тема</label>
            <select id="themeSelect" style="width: 100%;" onchange="setTheme(this.value)">
                <option value="light" id="optThemeLight">Світла</option>
                <option value="dark" id="optThemeDark">Темна</option>
            </select>
        </div>

        <div class="divider" style="margin: 10px 0;"></div>

        <div class="cloud-section">
            <label style="width: 100%; font-weight: bold; margin-bottom: 8px; display: block;" id="lblCloudHeader">Хмара (Firebase)</label>
            <div id="auth-container">
                <input type="email" id="email" placeholder="Email" style="width: 100%; margin-bottom: 6px; text-align: left;" onfocus="this.value=''">
                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 8px; text-align: left;" onfocus="this.value=''">
                <button id="btn-login" class="action-btn btn-auth-action">Увійти</button>
                <button id="btn-register" class="action-btn" style="background: var(--text-main); margin-top: 4px;">Реєстрація</button>
            </div>
            <div id="sync-container" class="hidden">
                <span id="user-email-display" style="font-size: 11px; display: block; margin-bottom: 8px; word-break: break-all; font-weight: bold;"></span>
                <button id="btn-sync-up" class="action-btn btn-sync">Зберегти у хмару ☁️</button>
                <button id="btn-sync-down" class="action-btn" style="background: #2980b9; margin-top: 4px;">Завантажити з хмари 📥</button>
                <button id="btn-logout" class="action-btn btn-logout" style="margin-top: 8px;">Вийти з акаунта</button>
            </div>
        </div>
    </div>

    <div class="header-row">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="lblTitle" style="margin-right: auto; margin-left: 15px;">Калькулятор ЗП</h2>
    </div>
    
    <div class="form-group">
        <label id="lblMonth">Місяць</label>
        <select id="monthSelect"></select>
    </div>

    <div class="form-group">
        <label id="lblBase">Загальна ставка (zł)</label>
        <input type="number" id="baseSalary" value="5950" onfocus="this.value=''" onblur="if(this.value==='') this.value='0'; calculateSalary();">
    </div>

    <div class="form-group">
        <label id="lblScheduleDays">Графікові роб. дні (Група)</label>
        <input type="number" id="scheduleDays" placeholder="Напр. 22" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <!-- БЛОК ВІДПУСТКИ -->
    <div class="form-group">
        <label id="lblVacationDays">Відпустка (днів)</label>
        <input type="number" id="vacationDays" placeholder="0" onfocus="this.value=''" onblur="calculateSalary()">
    </div>
    <div class="form-group sub-group hidden" id="urlopBonusGroup">
        <label id="lblUrlopBonus">Średnia urlopowa (zł) ℹ️</label>
        <input type="number" id="urlopBonus" placeholder="0.00" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <!-- БЛОК ЛІКАРНЯНОГО -->
    <div class="form-group">
        <label id="lblL4Days">Лікарняний L4 (календарні)</label>
        <input type="number" id="l4Days" placeholder="0" onfocus="this.value=''" onblur="calculateSalary()">
    </div>
    <div class="form-group sub-group hidden" id="workedDaysGroup">
        <label id="lblWorkedDays">Скільки днів відпрацьовано?</label>
        <input type="number" id="workedDays" placeholder="Фактично" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblBonus">Премія</label>
        <select id="bonusPctSelect">
            <option value="" disabled selected>-</option>
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblMorning">Ранкові зміни (шт)</label>
        <input type="number" id="morningShifts" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblNight">Нічні зміни (шт)</label>
        <input type="number" id="nightShifts" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblWeekend">Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblOvertime">Надгодини (днів)</label>
        <input type="number" id="overtimeDays" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label id="lblUnder26">Вік до 26 років</label>
        <select id="under26Select">
            <option value="no" id="optU26No" selected>Ні</option>
            <option value="yes" id="optU26Yes">Так</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblPPK">Участь у PPK</label>
        <select id="ppkSelect">
            <option value="no" id="optPpkNo" selected>Ні</option>
            <option value="yes" id="optPpkYes">Так</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblInsurance">Додаткове страхування</label>
        <select id="insuranceSelect">
            <option value="yes" id="optInsYes" selected>Так</option>
            <option value="no" id="optInsNo">Ні</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box brutto">
            <div class="result-title">BRUTTO</div>
            <div class="result-value" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box netto">
            <div class="result-title">NETTO</div>
            <div class="result-value" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
        authDomain: "my-salary-9ea25.firebaseapp.com",
        projectId: "my-salary-9ea25",
        storageBucket: "my-salary-9ea25.firebasestorage.app",
        messagingSenderId: "412323283290",
        appId: "1:412323283290:web:b4706af670a57776333363"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const dict = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)",
            scheduleDays: "Графікові роб. дні (Група)", vacationDays: "Відпустка (днів)",
            urlopBonus: "Доплата за відпустку (zł) ℹ️", l4Days: "Лікарняний L4 (календарні)",
            workedDays: "Скільки днів відпрацьовано?", bonus: "Премія", morning: "Ранкові зміни (шт)", 
            night: "Нічні зміни (шт)", weekend: "Робочі сб / нд (днів)", overtime: "Надгодини (днів)", 
            under26: "Вік до 26 років", ppk: "Участь у PPK", insurance: "Дод. страхування", yes: "Так", no: "Ні",
            menuTitle: "Меню", menuLang: "Мова", menuTheme: "Тема", cloudHeader: "Хмарна синхронізація",
            themeLight: "Світла", themeDark: "Темна", 
            months: ["Січень 2026", "Лютий 2026", "Березень 2026", "Квітень 2026", "Травень 2026", "Червень 2026", "Липень 2026", "Серпень 2026", "Вересень 2026", "Жовтень 2026", "Листопад 2026", "Грудень 2026"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka (zł)",
            scheduleDays: "Dni robocze z grafiku", vacationDays: "Urlop (dni)",
            urlopBonus: "Średnia urlopowa (zł) ℹ️", l4Days: "L4 (dni kalendarzowe)",
            workedDays: "Ile dni przepracowano?", bonus: "Premia", morning: "Poranne zmiany (szt)", 
            night: "Nocne zmiany (szt)", weekend: "Weekendy (dni)", overtime: "Nadgodziny (dni)", 
            under26: "Wiek < 26 lat", ppk: "PPK", insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie",
            menuTitle: "Menu", menuLang: "Język", menuTheme: "Motyw", cloudHeader: "Chmura (Firebase)",
            themeLight: "Jasny", themeDark: "Ciemny",
            months: ["Styczeń 2026", "Luty 2026", "Marzec 2026", "Kwiecień 2026", "Maj 2026", "Czerwiec 2026", "Lipiec 2026", "Sierpień 2026", "Wrzesień 2026", "Październik 2026", "Listopad 2026", "Grudzień 2026"]
        }
    };

    let currentLang = 'ua';
    // Державні норми робочих днів на 2026 рік (тільки для розрахунку вартості 1 нічної/надгодини)
    const stateWorkDays2026 = [20, 20, 22, 21, 20, 21, 23, 20, 22, 22, 20, 20];

    window.toggleMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }
    window.setTheme = function(theme) {
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
        localStorage.setItem('theme', theme);
    }

    window.setLang = function(lang) {
        currentLang = lang;
        const d = dict[lang];
        document.getElementById('lblTitle').innerText = d.title;
        document.getElementById('lblMonth').innerText = d.month;
        document.getElementById('lblBase').innerText = d.base;
        document.getElementById('lblScheduleDays').innerText = d.scheduleDays;
        document.getElementById('lblVacationDays').innerText = d.vacationDays;
        document.getElementById('lblUrlopBonus').innerText = d.urlopBonus;
        document.getElementById('lblL4Days').innerText = d.l4Days;
        document.getElementById('lblWorkedDays').innerText = d.workedDays;
        document.getElementById('lblBonus').innerText = d.bonus;
        document.getElementById('lblMorning').innerText = d.morning;
        document.getElementById('lblNight').innerText = d.night;
        document.getElementById('lblWeekend').innerText = d.weekend;
        document.getElementById('lblOvertime').innerText = d.overtime;
        document.getElementById('lblUnder26').innerText = d.under26;
        document.getElementById('lblPPK').innerText = d.ppk;
        document.getElementById('lblInsurance').innerText = d.insurance;
        document.getElementById('menuTitle').innerText = d.menuTitle;
        document.getElementById('lblMenuLang').innerText = d.menuLang;
        document.getElementById('lblMenuTheme').innerText = d.menuTheme;
        
        document.getElementById('optU26Yes').innerText = d.yes; document.getElementById('optU26No').innerText = d.no;
        document.getElementById('optPpkYes').innerText = d.yes; document.getElementById('optPpkNo').innerText = d.no;
        document.getElementById('optInsYes').innerText = d.yes; document.getElementById('optInsNo').innerText = d.no;

        initMonths();
        calculateSalary();
    }

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '<option value="" disabled selected>-</option>';
        dict[currentLang].months.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = "2026-" + String(idx + 1).padStart(2, '0');
            opt.text = m;
            select.appendChild(opt);
        });
        select.value = currentVal || "2026-01";
    }

    window.calculateSalary = function() {
        // Управління видимістю нових полів
        const vacDays = parseInt(document.getElementById('vacationDays').value) || 0;
        const l4Days = parseInt(document.getElementById('l4Days').value) || 0;
        
        document.getElementById('urlopBonusGroup').classList.toggle('hidden', vacDays === 0);
        document.getElementById('workedDaysGroup').classList.toggle('hidden', l4Days === 0);

        const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
        const monthVal = document.getElementById('monthSelect').value;
        if (baseSalary === 0 || monthVal === "") return updateUI(0, 0);

        // Державні дані для нічних / надгодин
        const monthIdx = parseInt(monthVal.split('-')[1]) - 1;
        const stateDays = stateWorkDays2026[monthIdx];
        const minSalary = 4806.00; 
        const nightTariff = Math.round(((minSalary / (stateDays * 8)) * 0.20) * 100) / 100;
        const overtimeTariff = Math.round(((baseSalary / stateDays) * 2) * 100) / 100;

        // Дані користувача (графік)
        const schedDays = parseInt(document.getElementById('scheduleDays').value) || stateDays; // Якщо пусто, беремо державні
        
        // Визначення фактично відпрацьованих днів для премії
        let actualWorkedDays = schedDays - vacDays;
        if (l4Days > 0) {
            actualWorkedDays = parseInt(document.getElementById('workedDays').value) || 0;
        }
        actualWorkedDays = Math.max(0, actualWorkedDays); // Захист від мінуса

        // Лікарняний (L4) 80% (віднімаємо 1/30 базової ставки за кожен день)
        let adjustedBase = baseSalary;
        let l4Pay = 0;
        if (l4Days > 0) {
            adjustedBase = baseSalary - ((baseSalary / 30) * l4Days);
            // Виплата лікарняних (без 13,71% ZUS) = 86,29% від ставки
            l4Pay = ((baseSalary * 0.8629) / 30) * 0.80 * l4Days; 
        }

        const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        const bonusAmount = (baseSalary * (bonusPct / 100)) / schedDays * actualWorkedDays;

        const morningShifts = parseInt(document.getElementById('morningShifts').value) || 0;
        const nightShifts = parseInt(document.getElementById('nightShifts').value) || 0;
        const weekendDays = parseInt(document.getElementById('weekendDays').value) || 0;
        const overtimeDays = parseFloat(document.getElementById('overtimeDays').value) || 0;
        const urlopBonus = parseFloat(document.getElementById('urlopBonus').value) || 0;

        const totalNightPay = Math.round((morningShifts * (10/60) * nightTariff) * 100)/100 + (nightShifts * 8 * nightTariff) + (nightShifts * 30);
        const weekendPay = weekendDays * 100;
        const overtimePay = overtimeDays * overtimeTariff;

        // БРУТТО
        const gross = adjustedBase + l4Pay + bonusAmount + totalNightPay + weekendPay + overtimePay + urlopBonus;

        // ПОДАТКИ ТА ZUS
        const isUnder26 = document.getElementById('under26Select').value === 'yes';
        const ppkActive = document.getElementById('ppkSelect').value === 'yes';
        
        // ZUS (від соціальних внесків 13,71% звільняється сума лікарняного L4)
        const zusBase = gross - l4Pay; 
        const zus = zusBase * 0.1371; 
        const healthBase = gross - zus; // Медичний 9% береться з усієї суми (вкл. лікарняні)
        const nfz = Math.round((healthBase * 0.09) * 100) / 100;
        const ppkEmployee = ppkActive ? (gross * 0.02) : 0;

        let pit = 0;
        if (!isUnder26) {
            const kup = 300.00; // Koszty uzyskania przychodu
            const pitBase = Math.round(Math.max(0, healthBase - kup));
            let nominalPit = (pitBase * 0.12) - 300.00;
            pit = Math.max(0, Math.round(nominalPit) + 54.00);
        }

        const insuranceDeduction = document.getElementById('insuranceSelect').value === 'yes' ? 36.70 : 0;
        const net = gross - zus - nfz - pit - ppkEmployee - insuranceDeduction - 30.25 + 15.00; // -Benefit +Laundry

        updateUI(gross, net);
        saveLocalData();
    }

    function updateUI(gross, net) {
        document.getElementById('grossResult').innerText = gross.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = net.toFixed(2) + ' zł';
    }

    function saveLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (!month) return;
        const data = {
            baseSalary: document.getElementById('baseSalary').value,
            scheduleDays: document.getElementById('scheduleDays').value,
            vacationDays: document.getElementById('vacationDays').value,
            urlopBonus: document.getElementById('urlopBonus').value,
            l4Days: document.getElementById('l4Days').value,
            workedDays: document.getElementById('workedDays').value,
            bonusPct: document.getElementById('bonusPctSelect').value,
            morningShifts: document.getElementById('morningShifts').value,
            nightShifts: document.getElementById('nightShifts').value,
            weekendDays: document.getElementById('weekendDays').value,
            overtimeDays: document.getElementById('overtimeDays').value,
            under26: document.getElementById('under26Select').value,
            ppk: document.getElementById('ppkSelect').value,
            insurance: document.getElementById('insuranceSelect').value
        };
        localStorage.setItem('salary_' + month, JSON.stringify(data));
    }

    function loadLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (!month) return;
        const saved = localStorage.getItem('salary_' + month);
        if (saved) {
            const d = JSON.parse(saved);
            document.getElementById('baseSalary').value = d.baseSalary || "5950";
            document.getElementById('scheduleDays').value = d.scheduleDays || "";
            document.getElementById('vacationDays').value = d.vacationDays || "";
            document.getElementById('urlopBonus').value = d.urlopBonus || "";
            document.getElementById('l4Days').value = d.l4Days || "";
            document.getElementById('workedDays').value = d.workedDays || "";
            document.getElementById('bonusPctSelect').value = d.bonusPct || "";
            document.getElementById('morningShifts').value = d.morningShifts || "";
            document.getElementById('nightShifts').value = d.nightShifts || "";
            document.getElementById('weekendDays').value = d.weekendDays || "";
            document.getElementById('overtimeDays').value = d.overtimeDays || "";
            document.getElementById('under26Select').value = d.under26 || "no";
            document.getElementById('ppkSelect').value = d.ppk || "no";
            document.getElementById('insuranceSelect').value = d.insurance || "yes";
        } else {
            document.querySelectorAll('input[type=number]').forEach(el => el.value = '');
            document.getElementById('baseSalary').value = "5950";
            document.getElementById('bonusPctSelect').value = "";
        }
        calculateSalary();
    }

    document.querySelectorAll('input, select').forEach(element => {
        if(!['langSelect', 'themeSelect', 'email', 'password'].includes(element.id)) {
            element.addEventListener('input', calculateSalary);
            element.addEventListener('change', calculateSalary);
        }
    });

    document.getElementById('monthSelect').addEventListener('change', loadLocalData);

    // Firebase Auth & Sync
    onAuthStateChanged(auth, (user) => {
        document.getElementById('auth-container').classList.toggle('hidden', !!user);
        document.getElementById('sync-container').classList.toggle('hidden', !user);
        if(user) document.getElementById('user-email-display').innerText = "👤 " + user.email;
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert("Помилка входу: " + e.message); }
    });
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    document.getElementById('btn-sync-up').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        const month = document.getElementById('monthSelect').value;
        const docRef = doc(db, "users", user.uid, "months", month);
        
        const data = {
            baseSalary: document.getElementById('baseSalary').value,
            scheduleDays: document.getElementById('scheduleDays').value,
            vacationDays: document.getElementById('vacationDays').value,
            urlopBonus: document.getElementById('urlopBonus').value,
            l4Days: document.getElementById('l4Days').value,
            workedDays: document.getElementById('workedDays').value,
            bonusPct: document.getElementById('bonusPctSelect').value,
            morningShifts: document.getElementById('morningShifts').value,
            nightShifts: document.getElementById('nightShifts').value,
            weekendDays: document.getElementById('weekendDays').value,
            overtimeDays: document.getElementById('overtimeDays').value,
            updatedAt: new Date()
        };
        await setDoc(docRef, data);
        alert("Дані збережені у хмару! ☁️");
    });

    document.getElementById('btn-sync-down').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        const month = document.getElementById('monthSelect').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "months", month));
        if (docSnap.exists()) {
            const d = docSnap.data();
            document.getElementById('baseSalary').value = d.baseSalary || "5950";
            document.getElementById('scheduleDays').value = d.scheduleDays || "";
            document.getElementById('vacationDays').value = d.vacationDays || "";
            document.getElementById('urlopBonus').value = d.urlopBonus || "";
            document.getElementById('l4Days').value = d.l4Days || "";
            document.getElementById('workedDays').value = d.workedDays || "";
            document.getElementById('bonusPctSelect').value = d.bonusPct || "";
            document.getElementById('morningShifts').value = d.morningShifts || "";
            document.getElementById('nightShifts').value = d.nightShifts || "";
            document.getElementById('weekendDays').value = d.weekendDays || "";
            document.getElementById('overtimeDays').value = d.overtimeDays || "";
            calculateSalary();
            alert("Дані завантажені! 📥");
        } else {
            alert("У хмарі немає збережень за цей місяць.");
        }
    });

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.getElementById('themeSelect').value = savedTheme;
    setTheme(savedTheme);
    window.setLang('ua');
    loadLocalData();
</script>
</body>
</html>
