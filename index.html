<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор Fiege</title>
    <style>
        :root {
            --primary: #e3000f; 
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e5ec;
            --success: #27ae60;
            --premium-bg: #fff9e6;
            --premium-border: #f1c40f;
        }

        [data-theme="dark"] {
            --primary: #ff4d57;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --success: #2ecc71;
            --premium-bg: #2a2411;
            --premium-border: #d4ac0d;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; 
            box-sizing: border-box; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; transition: background 0.3s, color 0.3s;
        }

        .calculator { 
            width: 100%; max-width: 420px; background: var(--panel-bg); padding: 24px 20px; 
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
            box-sizing: border-box; position: relative; transition: background 0.3s;
        }

        .menu-btn, .close-menu { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-main); padding: 0; }
        
        .side-menu {
            position: absolute; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--panel-bg); box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            border-radius: 16px 0 0 16px; z-index: 10; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; transition: transform 0.3s ease;
            transform: translateX(-100%); overflow-y: auto;
        }
        .side-menu.open { transform: translateX(0); }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .menu-item { margin-bottom: 15px; }
        .menu-item label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; width: 100%; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h2 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .premium-badge { background: var(--premium-border); color: #000; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: none; }

        .form-group { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        
        /* Premium Fields Styling */
        .premium-field { display: none; }
        .is-logged-in .premium-field { display: flex; }
        .is-logged-in .premium-badge { display: inline-block; }
        
        .premium-highlight { background: var(--premium-bg); padding: 12px 10px; border-radius: 8px; margin-bottom: 14px; border: 1px dashed var(--premium-border); }
        .sub-group { margin-top: -6px; margin-bottom: 14px; padding-left: 15px; border-left: 2px solid var(--premium-border); }
        label { font-size: 14px; font-weight: 500; color: var(--text-main); width: 60%; }
        .sub-group label { font-size: 13px; font-weight: 600; color: var(--primary); }

        input, select { 
            width: 38%; padding: 10px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 14px; text-align: center; 
            background: var(--bg-color); color: var(--text-main);
            font-weight: 600; box-sizing: border-box; appearance: none;
        }
        
        select {
            text-align-last: center; padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237f8c8d%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.1); }
        input::placeholder { color: var(--text-muted); font-weight: 400; }

        .divider { border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        .results-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .result-box { border-radius: 12px; padding: 16px 12px; text-align: center; }
        .result-box.brutto { background: var(--bg-color); border: 1px solid var(--border-color); }
        .result-box.netto { background: rgba(39, 174, 96, 0.08); border: 1px solid var(--success); }
        .result-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; }
        .result-value { font-size: 20px; font-weight: 800; }
        .brutto .result-value { color: var(--text-main); }
        .netto .result-value { color: var(--success); }

        .hidden { display: none !important; }
        .action-btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sync { background: var(--success); }
        .btn-auth-action { background: var(--primary); }
        .btn-logout { background: var(--text-muted); }
        .cloud-section { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); }
    </style>
</head>
<body id="app-body">

<div class="calculator">
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span id="menuTitle" style="font-size: 15px; font-weight: bold;">Меню</span>
            <button class="close-menu" onclick="toggleMenu()">✕</button>
        </div>

        <div class="menu-item">
            <label id="lblMenuLang">Мова</label>
            <select id="langSelect" style="width: 100%;" onchange="setLang(this.value)">
                <option value="ua">Українська</option>
                <option value="pl">Polski</option>
            </select>
        </div>

        <div class="menu-item">
            <label id="lblMenuTheme">Тема</label>
            <select id="themeSelect" style="width: 100%;" onchange="setTheme(this.value)">
                <option value="light" id="optThemeLight">Світла</option>
                <option value="dark" id="optThemeDark">Темна</option>
            </select>
        </div>

        <div class="divider" style="margin: 10px 0;"></div>

        <div class="cloud-section">
            <label style="width: 100%; font-weight: bold; margin-bottom: 8px; display: block;" id="lblCloudHeader">Акаунт & Хмара</label>
            <div id="auth-container">
                <input type="email" id="email" placeholder="Email" style="width: 100%; margin-bottom: 6px; text-align: left;" onfocus="this.value=''">
                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 8px; text-align: left;" onfocus="this.value=''">
                <button id="btn-login" class="action-btn btn-auth-action">Увійти (PRO)</button>
                <button id="btn-register" class="action-btn" style="background: var(--text-main); margin-top: 4px;">Реєстрація</button>
            </div>
            <div id="sync-container" class="hidden">
                <span id="user-email-display" style="font-size: 11px; display: block; margin-bottom: 8px; word-break: break-all; font-weight: bold;"></span>
                <button id="btn-sync-up" class="action-btn btn-sync">Зберегти місяць ☁️</button>
                <button id="btn-sync-down" class="action-btn" style="background: #2980b9; margin-top: 4px;">Завантажити місяць 📥</button>
                <button id="btn-logout" class="action-btn btn-logout" style="margin-top: 8px;">Вийти (Гостьовий режим)</button>
            </div>
        </div>
    </div>

    <div class="header-row">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="lblTitle" style="margin-right: auto; margin-left: 15px;">Калькулятор ЗП <span class="premium-badge">PRO</span></h2>
    </div>
    
    <div class="form-group">
        <label id="lblMonth">Місяць</label>
        <select id="monthSelect"></select>
    </div>

    <div class="form-group">
        <label id="lblBase">Загальна ставка (zł)</label>
        <input type="number" id="baseSalary" value="5750" onfocus="this.value=''" onblur="if(this.value==='') calculateSalary();">
    </div>

    <!-- PREMIUM БЛОКИ: ГРУПА, ВІДПУСТКА, ЛІКАРНЯНІ -->
    <div class="premium-highlight premium-field flex-col">
        <div class="form-group" style="width:100%">
            <label id="lblGroup">Робоча група</label>
            <select id="userGroup" onchange="saveProfile(); calculateSalary();">
                <option value="A">Grupa A</option>
                <option value="B">Grupa B</option>
                <option value="C">Grupa C</option>
                <option value="D" selected>Grupa D</option>
            </select>
        </div>
        <div class="form-group" style="width:100%; margin-bottom: 0;">
            <label id="lblScheduleDays" style="font-size:12px; color:var(--text-muted)">Дні за графіком (авто):</label>
            <input type="number" id="scheduleDays" readonly style="background:transparent; border:none; box-shadow:none; text-align:right; padding:0; color:var(--text-muted)">
        </div>
    </div>

    <div class="form-group premium-field">
        <label id="lblVacationDays">Відпустка (днів)</label>
        <input type="number" id="vacationDays" placeholder="0" onfocus="this.value=''">
    </div>
    <div class="form-group sub-group premium-field hidden" id="urlopBonusGroup">
        <!-- ТЕПЕР ЦЕ ВАРТІСТЬ ОДНОГО ДНЯ -->
        <label id="lblUrlopBonus">Середня за 1 день відп. (zł) ℹ️</label>
        <input type="number" id="urlopBonus" placeholder="0.00" onfocus="this.value=''" style="color:var(--primary);">
    </div>

    <div class="form-group premium-field">
        <label id="lblL4Days">Лікарняний L4 (календарні)</label>
        <input type="number" id="l4Days" placeholder="0" onfocus="this.value=''" onblur="calculateSalary()">
    </div>
    <div class="form-group sub-group premium-field hidden" id="workedDaysGroup">
        <label id="lblWorkedDays">Фактично відпрацьовано (днів)</label>
        <input type="number" id="workedDays" placeholder="Введіть" onfocus="this.value=''" onblur="calculateSalary()">
    </div>
    <!-- КІНЕЦЬ PREMIUM БЛОКІВ -->

    <div class="form-group">
        <label id="lblBonus">Премія</label>
        <select id="bonusPctSelect">
            <option value="" disabled selected>-</option>
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblMorning">Ранкові зміни (шт)</label>
        <input type="number" id="morningShifts" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblNight">Нічні зміни (шт)</label>
        <input type="number" id="nightShifts" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblWeekend">Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="form-group">
        <label id="lblOvertime">Надгодини (днів)</label>
        <input type="number" id="overtimeDays" placeholder="-" onfocus="this.value=''" onblur="calculateSalary()">
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label id="lblUnder26">Вік до 26 років</label>
        <select id="under26Select">
            <option value="no" id="optU26No" selected>Ні</option>
            <option value="yes" id="optU26Yes">Так</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblPPK">Участь у PPK</label>
        <select id="ppkSelect">
            <option value="no" id="optPpkNo" selected>Ні</option>
            <option value="yes" id="optPpkYes">Так</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblInsurance">Додаткове страхування</label>
        <select id="insuranceSelect">
            <option value="yes" id="optInsYes" selected>Так</option>
            <option value="no" id="optInsNo">Ні</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box brutto">
            <div class="result-title">BRUTTO</div>
            <div class="result-value" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box netto">
            <div class="result-title">NETTO</div>
            <div class="result-value" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
        authDomain: "my-salary-9ea25.firebaseapp.com",
        projectId: "my-salary-9ea25",
        storageBucket: "my-salary-9ea25.firebasestorage.app",
        messagingSenderId: "412323283290",
        appId: "1:412323283290:web:b4706af670a57776333363"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const dict = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)",
            group: "Робоча група", schedDays: "Дні за графіком (авто):",
            vacationDays: "Відпустка (днів)", urlopBonus: "Середня за 1 день відп. (zł) ℹ️", 
            l4Days: "Лікарняний L4 (календарні)", workedDays: "Фактично відпрацьовано (днів)", 
            bonus: "Премія", morning: "Ранкові зміни (шт)", night: "Нічні зміни (шт)", 
            weekend: "Робочі сб / нд (днів)", overtime: "Надгодини (днів)", 
            under26: "Вік до 26 років", ppk: "Участь у PPK", insurance: "Дод. страхування", yes: "Так", no: "Ні",
            menuTitle: "Меню", menuLang: "Мова", menuTheme: "Тема", 
            months: ["Січень 2026", "Лютий 2026", "Березень 2026", "Квітень 2026", "Травень 2026", "Червень 2026", "Липень 2026", "Серпень 2026", "Вересень 2026", "Жовтень 2026", "Листопад 2026", "Грудень 2026"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka (zł)",
            group: "Grupa robocza", schedDays: "Dni z grafiku (auto):",
            vacationDays: "Urlop (dni)", urlopBonus: "Średnia urlopowa za 1 dzień ℹ️", 
            l4Days: "L4 (dni kalendarzowe)", workedDays: "Przepracowano faktycznie (dni)", 
            bonus: "Premia", morning: "Poranne zmiany (szt)", night: "Nocne zmiany (szt)", 
            weekend: "Weekendy (dni)", overtime: "Nadgodziny (dni)", 
            under26: "Wiek < 26 lat", ppk: "PPK", insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie",
            menuTitle: "Menu", menuLang: "Język", menuTheme: "Motyw",
            months: ["Styczeń 2026", "Luty 2026", "Marzec 2026", "Kwiecień 2026", "Maj 2026", "Czerwiec 2026", "Lipiec 2026", "Sierpień 2026", "Wrzesień 2026", "Październik 2026", "Listopad 2026", "Grudzień 2026"]
        }
    };

    let currentLang = 'ua';
    let isPremium = false;

    const stateWorkDays = [20, 20, 22, 21, 20, 21, 23, 20, 22, 22, 20, 20];
    const groupMatrix = {
        A: [17, 18, 21, 22, 22, 24, 20, 21, 21, 23, 20, 21],
        B: [18, 16, 23, 22, 22, 23, 22, 21, 20, 21, 21, 20],
        C: [18, 18, 21, 21, 23, 21, 24, 20, 21, 21, 21, 20],
        D: [18, 18, 22, 23, 20, 22, 23, 18, 23, 22, 23, 18]
    };

    window.toggleMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }
    window.setTheme = function(theme) { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : ''); localStorage.setItem('theme', theme); }
    window.setLang = function(lang) {
        currentLang = lang; const d = dict[lang];
        document.getElementById('lblTitle').innerHTML = d.title + ' <span class="premium-badge">PRO</span>';
        document.getElementById('lblMonth').innerText = d.month;
        document.getElementById('lblBase').innerText = d.base;
        document.getElementById('lblGroup').innerText = d.group;
        document.getElementById('lblScheduleDays').innerText = d.schedDays;
        document.getElementById('lblVacationDays').innerText = d.vacationDays;
        document.getElementById('lblUrlopBonus').innerText = d.urlopBonus;
        document.getElementById('lblL4Days').innerText = d.l4Days;
        document.getElementById('lblWorkedDays').innerText = d.workedDays;
        document.getElementById('lblBonus').innerText = d.bonus;
        document.getElementById('lblMorning').innerText = d.morning;
        document.getElementById('lblNight').innerText = d.night;
        document.getElementById('lblWeekend').innerText = d.weekend;
        document.getElementById('lblOvertime').innerText = d.overtime;
        document.getElementById('lblUnder26').innerText = d.under26;
        document.getElementById('lblPPK').innerText = d.ppk;
        document.getElementById('lblInsurance').innerText = d.insurance;
        document.getElementById('menuTitle').innerText = d.menuTitle;
        document.getElementById('lblMenuLang').innerText = d.menuLang;
        document.getElementById('lblMenuTheme').innerText = d.menuTheme;
        document.getElementById('optU26Yes').innerText = d.yes; document.getElementById('optU26No').innerText = d.no;
        document.getElementById('optPpkYes').innerText = d.yes; document.getElementById('optPpkNo').innerText = d.no;
        document.getElementById('optInsYes').innerText = d.yes; document.getElementById('optInsNo').innerText = d.no;
        initMonths(); calculateSalary();
    }

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '<option value="" disabled selected>-</option>';
        dict[currentLang].months.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = "2026-" + String(idx + 1).padStart(2, '0');
            opt.text = m; select.appendChild(opt);
        });
        select.value = currentVal || "2026-01";
    }

    // Алгоритм рахує середню суму саме за ОДИН день
    function getAutoDailyUrlopBonus(currentYear, monthIdx) {
        let totalExtras = 0;
        let totalWorkedDays = 0;
        
        for (let i = 1; i <= 3; i++) {
            let pMonth = monthIdx + 1 - i;
            let pYear = currentYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastMonthStr = pYear + "-" + String(pMonth).padStart(2, '0');
            const savedStr = localStorage.getItem('salary_' + pastMonthStr);
            
            if (savedStr) {
                const data = JSON.parse(savedStr);
                const pastBase = parseFloat(data.baseSalary) || 5750;
                const pastPct = parseFloat(data.bonusPctSelect) || 0;
                const pastGroup = data.userGroup || 'D';
                const pastSched = parseInt(data.scheduleDays) || groupMatrix[pastGroup][pMonth - 1] || stateWorkDays[pMonth - 1];
                const pastVac = parseInt(data.vacationDays) || 0;
                const pastL4 = parseInt(data.l4Days) || 0;
                
                let pActual = pastSched - pastVac;
                if (pastL4 > 0) pActual = parseInt(data.workedDays) || 0;
                pActual = Math.max(0, pActual);
                
                const pastBonusVal = (pastBase * (pastPct / 100)) / pastSched * pActual;
                
                const mShifts = parseInt(data.morningShifts) || 0;
                const nShifts = parseInt(data.nightShifts) || 0;
                const wknd = parseInt(data.weekendDays) || 0;
                const over = parseFloat(data.overtimeDays) || 0;

                const stDays = stateWorkDays[pMonth - 1];
                const nTariff = ((4806 / (stDays * 8)) * 0.20);
                const pastNight = (mShifts * (10/60) * nTariff) + (nShifts * 8 * nTariff) + (nShifts * 30);
                const pastWknd = wknd * 100;
                const pastOver = over * ((pastBase / stDays) * 2);

                totalExtras += (pastBonusVal + pastNight + pastWknd + pastOver);
                totalWorkedDays += pActual;
            }
        }
        if (totalWorkedDays === 0) return 0;
        return (totalExtras / totalWorkedDays);
    }

    // Слухач для авто-заповнення поля денної ставки при введенні кількості днів відпустки
    document.getElementById('vacationDays').addEventListener('input', function() {
        const vacDays = parseInt(this.value) || 0;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return;
        const [year, month] = monthVal.split('-');
        
        const urlopInput = document.getElementById('urlopBonus');
        if (isPremium && vacDays > 0) {
            // Заповнюємо авто-тариф, тільки якщо поле пусте або нульове (щоб не перебивати ручний ввід)
            if (!urlopInput.value || parseFloat(urlopInput.value) === 0) {
                const autoDaily = getAutoDailyUrlopBonus(parseInt(year), parseInt(month) - 1);
                if (autoDaily > 0) urlopInput.value = autoDaily.toFixed(2);
            }
        } else {
            urlopInput.value = "";
        }
        calculateSalary();
    });

    window.calculateSalary = function() {
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return updateUI(0, 0);
        
        const monthIdx = parseInt(monthVal.split('-')[1]) - 1;
        const stateDays = stateWorkDays[monthIdx];
        
        const autoBase = monthIdx >= 9 ? 5950 : 5750;
        let baseInput = document.getElementById('baseSalary');
        if (!baseInput.value) baseInput.value = autoBase;
        const baseSalary = parseFloat(baseInput.value);

        const group = document.getElementById('userGroup').value;
        const schedDays = isPremium ? groupMatrix[group][monthIdx] : stateDays;
        if (isPremium) document.getElementById('scheduleDays').value = schedDays;

        const vacDays = isPremium ? (parseInt(document.getElementById('vacationDays').value) || 0) : 0;
        const l4Days = isPremium ? (parseInt(document.getElementById('l4Days').value) || 0) : 0;
        
        document.getElementById('urlopBonusGroup').classList.toggle('hidden', vacDays === 0);
        document.getElementById('workedDaysGroup').classList.toggle('hidden', l4Days === 0);

        // МНОЖИМО ТАРИФ 1 ДНЯ НА КІЛЬКІСТЬ ДНІВ ВІДПУСТКИ!
        const dailyUrlopBonus = (isPremium && vacDays > 0) ? (parseFloat(document.getElementById('urlopBonus').value) || 0) : 0;
        const totalUrlopBonus = dailyUrlopBonus * vacDays;

        let actualWorkedDays = schedDays - vacDays;
        if (l4Days > 0) actualWorkedDays = parseInt(document.getElementById('workedDays').value) || 0;
        actualWorkedDays = Math.max(0, actualWorkedDays);

        let adjustedBase = baseSalary;
        let l4Pay = 0;
        if (isPremium && l4Days > 0) {
            adjustedBase = baseSalary - ((baseSalary / 30) * l4Days);
            l4Pay = ((baseSalary * 0.8629) / 30) * 0.80 * l4Days; 
        }

        const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        const bonusAmount = isPremium ? ((baseSalary * (bonusPct / 100)) / schedDays * actualWorkedDays) : (baseSalary * (bonusPct / 100));

        const minSalary = 4806.00;
        const nightTariff = Math.round(((minSalary / (stateDays * 8)) * 0.20) * 100) / 100;
        const overtimeTariff = Math.round(((baseSalary / stateDays) * 2) * 100) / 100;

        const morningShifts = parseInt(document.getElementById('morningShifts').value) || 0;
        const nightShifts = parseInt(document.getElementById('nightShifts').value) || 0;
        const weekendDays = parseInt(document.getElementById('weekendDays').value) || 0;
        const overtimeDays = parseFloat(document.getElementById('overtimeDays').value) || 0;

        const totalNightPay = Math.round((morningShifts * (10/60) * nightTariff) * 100)/100 + (nightShifts * 8 * nightTariff) + (nightShifts * 30);
        
        // ДОДАЄМО ЗАГАЛЬНУ ВАРТІСТЬ ВСІХ ДНІВ ВІДПУСТКИ ДО БРУТТО
        const gross = adjustedBase + l4Pay + bonusAmount + totalNightPay + (weekendDays * 100) + (overtimeDays * overtimeTariff) + totalUrlopBonus;

        const isUnder26 = document.getElementById('under26Select').value === 'yes';
        const ppkActive = document.getElementById('ppkSelect').value === 'yes';
        
        const zusBase = gross - l4Pay; 
        const zus = zusBase * 0.1371; 
        const healthBase = gross - zus;
        const nfz = Math.round((healthBase * 0.09) * 100) / 100;
        
        let pit = 0;
        if (!isUnder26) {
            const pitBase = Math.round(Math.max(0, healthBase - 300.00));
            pit = Math.max(0, Math.round((pitBase * 0.12) - 300.00) + 54.00);
        }

        const net = gross - zus - nfz - pit - (ppkActive ? gross * 0.02 : 0) - (document.getElementById('insuranceSelect').value === 'yes' ? 36.70 : 0) - 30.25 + 15.00;

        updateUI(gross, net); saveLocalData();
    }

    function updateUI(g, n) {
        document.getElementById('grossResult').innerText = g.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = n.toFixed(2) + ' zł';
    }

    function saveLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (!month) return;
        const data = {};
        document.querySelectorAll('input, select').forEach(el => {
            if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id)) data[el.id] = el.value;
        });
        localStorage.setItem('salary_' + month, JSON.stringify(data));
    }

    function loadLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (!month) return;
        const saved = localStorage.getItem('salary_' + month);
        if (saved) {
            const d = JSON.parse(saved);
            document.querySelectorAll('input, select').forEach(el => {
                if(!['langSelect', 'themeSelect', 'email', 'password', 'userGroup'].includes(el.id) && d[el.id] !== undefined) {
                    el.value = d[el.id];
                }
            });
        } else {
            document.querySelectorAll('input[type=number]').forEach(el => el.value = '');
            document.getElementById('bonusPctSelect').value = "";
            document.getElementById('urlopBonus').value = "";
            document.getElementById('baseSalary').value = "";
        }
        calculateSalary();
    }

    window.saveProfile = async function() {
        if (!auth.currentUser) return;
        await setDoc(doc(db, "users", auth.currentUser.uid, "profile", "settings"), { group: document.getElementById('userGroup').value });
    }

    onAuthStateChanged(auth, async (user) => {
        isPremium = !!user;
        document.getElementById('app-body').classList.toggle('is-logged-in', isPremium);
        document.getElementById('auth-container').classList.toggle('hidden', isPremium);
        document.getElementById('sync-container').classList.toggle('hidden', !isPremium);
        
        if(user) {
            document.getElementById('user-email-display').innerText = "👤 " + user.email;
            const pDoc = await getDoc(doc(db, "users", user.uid, "profile", "settings"));
            if (pDoc.exists() && pDoc.data().group) document.getElementById('userGroup').value = pDoc.data().group;
        } else {
            document.getElementById('vacationDays').value = "";
            document.getElementById('l4Days').value = "";
            document.getElementById('urlopBonus').value = "";
        }
        calculateSalary();
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert("Помилка входу: " + e.message); }
    });
    document.getElementById('btn-register').addEventListener('click', async () => {
        try { await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); alert("Реєстрація успішна!"); } 
        catch (e) { alert("Помилка: " + e.message); }
    });
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    document.getElementById('btn-sync-up').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        const data = {};
        document.querySelectorAll('input, select').forEach(el => {
            if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id)) data[el.id] = el.value;
        });
        await setDoc(doc(db, "users", auth.currentUser.uid, "months", document.getElementById('monthSelect').value), data);
        alert("Дані збережені у хмару! ☁️");
    });

    document.getElementById('btn-sync-down').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", document.getElementById('monthSelect').value));
        if (snap.exists()) {
            const d = snap.data();
            document.querySelectorAll('input, select').forEach(el => {
                if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id) && d[el.id] !== undefined) el.value = d[el.id];
            });
            calculateSalary(); alert("Дані завантажені! 📥");
        } else alert("Даних за цей місяць у хмарі немає.");
    });

    document.querySelectorAll('input, select').forEach(el => {
        if(!['langSelect', 'themeSelect', 'email', 'password', 'vacationDays'].includes(el.id)) {
            el.addEventListener('input', calculateSalary); el.addEventListener('change', calculateSalary);
        }
    });
    document.getElementById('monthSelect').addEventListener('change', loadLocalData);

    setTheme(localStorage.getItem('theme') || 'light');
    window.setLang('ua'); loadLocalData();
</script>
</body>
</html>
