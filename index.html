<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор Fiege V2</title>
    <style>
        :root {
            --primary: #e3000f; 
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e5ec;
            --success: #27ae60;
            --premium-bg: #fff9e6;
            --premium-border: #f1c40f;
        }

        [data-theme="dark"] {
            --primary: #ff4d57;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --success: #2ecc71;
            --premium-bg: #2a2411;
            --premium-border: #d4ac0d;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; 
            box-sizing: border-box; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; transition: background 0.3s, color 0.3s;
        }

        .calculator { 
            width: 100%; max-width: 420px; background: var(--panel-bg); padding: 24px 20px; 
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
            box-sizing: border-box; position: relative; transition: background 0.3s;
        }

        .menu-btn, .close-menu { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-main); padding: 0; }
        
        .side-menu {
            position: absolute; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--panel-bg); box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            border-radius: 16px 0 0 16px; z-index: 10; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; transition: transform 0.3s ease;
            transform: translateX(-100%); overflow-y: auto;
        }
        .side-menu.open { transform: translateX(0); }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .menu-item { margin-bottom: 15px; }
        .menu-item label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; width: 100%; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; }
        h2 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .premium-badge { background: var(--premium-border); color: #000; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: none; }

        .schedule-badge {
            background: var(--premium-bg); border: 1px solid var(--premium-border);
            border-radius: 8px; padding: 4px 6px; display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            min-width: 45px;
        }
        .is-logged-in .schedule-badge { display: flex; }
        .schedule-badge span { font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .schedule-badge input {
            width: 100%; padding: 0; background: transparent; border: none;
            font-size: 15px; font-weight: 800; color: var(--primary); text-align: center; box-shadow: none;
        }
        .schedule-badge input:focus { box-shadow: none; outline: none; }

        .form-group { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        
        .premium-field { display: none; }
        .is-logged-in .premium-field { display: flex; }
        .is-logged-in .premium-badge { display: inline-block; }
        
        .sub-group { margin-top: -6px; margin-bottom: 14px; padding-left: 15px; border-left: 2px solid var(--premium-border); }
        label { font-size: 14px; font-weight: 500; color: var(--text-main); width: 60%; }
        .sub-group label { font-size: 13px; font-weight: 600; color: var(--primary); }

        input, select { 
            width: 38%; padding: 10px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 14px; text-align: center; 
            background: var(--bg-color); color: var(--text-main);
            font-weight: 600; box-sizing: border-box; appearance: none;
        }
        
        select {
            text-align-last: center; padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237f8c8d%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.1); }
        input::placeholder { color: var(--text-muted); font-weight: 400; }

        .divider { border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        .results-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .result-box { border-radius: 12px; padding: 16px 12px; text-align: center; }
        .result-box.brutto { background: var(--bg-color); border: 1px solid var(--border-color); }
        .result-box.netto { background: rgba(39, 174, 96, 0.08); border: 1px solid var(--success); }
        .result-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; }
        .result-value { font-size: 20px; font-weight: 800; }
        .brutto .result-value { color: var(--text-main); }
        .netto .result-value { color: var(--success); }

        .hidden { display: none !important; }
        .action-btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sync { background: var(--success); }
        .btn-auth-action { background: var(--primary); }
        .btn-logout { background: var(--text-muted); }
        .cloud-section { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); }
    </style>
</head>
<body id="app-body">

<div class="calculator">
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span data-i18n="menuTitle" style="font-size: 15px; font-weight: bold;">Меню</span>

        <div class="divider" style="margin: 10px 0;"></div>

        <div class="cloud-section">

                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 8px; text-align: left;">
                <button id="btn-login" class="action-btn btn-auth-action">Увійти (PRO)</button>

            </div>
            <div id="sync-container" class="hidden">

                <button id="btn-sync-up" class="action-btn btn-sync" data-i18n="btnSyncUp">Зберегти місяць ☁️</button>
                <button id="btn-sync-down" class="action-btn" style="background: #2980b9; margin-top: 4px;" data-i18n="btnSyncDown">Завантажити місяць 📥</button>
                <button id="btn-logout" class="action-btn btn-logout" style="margin-top: 8px;" data-i18n="btnLogout">Вийти (Гостьовий режим)</button>

    </div>

    <div class="header-row">

        <h2 style="margin-right: auto; margin-left: 15px;"><span data-i18n="title">Калькулятор ЗП</span> <span class="premium-badge">PRO</span></h2>

            <input type="number" id="scheduleDays" placeholder="0" min="0">

    </div>
    
    <div class="form-group">
        <label data-i18n="month">Місяць</label>
        <select id="monthSelect"></select>
    </div>

    <div class="form-group">
        <label data-i18n="base">Загальна ставка (zł)</label>
        <input type="number" id="baseSalary" value="5750" min="0">
    </div>

    <div class="form-group">
        <label data-i18n="bonus">Премія</label>

            <option value="15" selected>15%</option>

    <div class="form-group">

        <input type="number" id="afternoonShifts" placeholder="-" min="0">
    </div>
    <div class="form-group">
        <label data-i18n="night">Нічні зміни (шт)</label>
        <input type="number" id="nightShifts" placeholder="-" min="0">
    </div>

    <div class="form-group">
        <label data-i18n="weekend">Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" placeholder="-" min="0">
    </div>

    <div class="form-group">
        <label data-i18n="overtime">Надгодини (днів)</label>
        <input type="number" id="overtimeDays" placeholder="-" min="0" step="0.5">
    </div>

    <div class="form-group premium-field">
        <label data-i18n="vacationDays">Відпустка (днів)</label>
        <input type="number" id="vacationDays" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="urlopBonusGroup">
        <label data-i18n="urlopBonus">Сума відпустки (zł) ℹ️</label>
        <input type="number" id="urlopBonus" placeholder="0.00" min="0" style="color:var(--primary);">
    </div>

    <div class="form-group premium-field">
        <label data-i18n="bloodDonation">Донація крові (днів)</label>
        <input type="number" id="bloodDonationDays" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="bloodBonusGroup">
        <label data-i18n="bloodBonus">Сума донації (zł) ℹ️</label>
        <input type="number" id="bloodBonus" placeholder="0.00" min="0" style="color:var(--primary);">
    </div>

    <div class="form-group premium-field">
        <label data-i18n="l4Days">Лікарняний L4 (календарні)</label>
        <input type="number" id="l4Days" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="l4MissedGroup">
        <label data-i18n="l4Missed">Пропущено змін (шт) ℹ️</label>
        <input type="number" id="l4MissedShifts" placeholder="0" min="0" style="color:var(--primary);">
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label data-i18n="under26">Вік до 26 років</label>
        <select id="under26Select">
            <option value="no" data-i18n="no" selected>Ні</option>
            <option value="yes" data-i18n="yes">Так</option>
        </select>
    </div>
    <div class="form-group">
        <label data-i18n="ppk">Участь у PPK</label>
        <select id="ppkSelect">
            <option value="no" data-i18n="no" selected>Ні</option>
            <option value="yes" data-i18n="yes">Так</option>
        </select>
    </div>
    <div class="form-group">
        <label data-i18n="insurance">Додаткове страхування</label>
        <select id="insuranceSelect">
            <option value="yes" data-i18n="yes" selected>Так</option>
            <option value="no" data-i18n="no">Ні</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box brutto">
            <div class="result-title">BRUTTO</div>
            <div class="result-value" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box netto">
            <div class="result-title">NETTO</div>
            <div class="result-value" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /* ==========================================
       КОНФІГУРАЦІЯ ТА РЕЄСТРИ ПЕРІОДІВ (V2)
       ========================================== */
    const CALENDAR_REGISTRY = {
        "2026-01": { workingDays: 20 }, "2026-02": { workingDays: 20 }, "2026-03": { workingDays: 22 },
        "2026-04": { workingDays: 21 }, "2026-05": { workingDays: 20 }, "2026-06": { workingDays: 21 },
        "2026-07": { workingDays: 23 }, "2026-08": { workingDays: 20 }, "2026-09": { workingDays: 22 },
        "2026-10": { workingDays: 22 }, "2026-11": { workingDays: 20 }, "2026-12": { workingDays: 20 },
        // За замовчуванням для майбутніх періодів
        "default": { workingDays: 21 }
    };

    const SALARY_RATES_REGISTRY = {
        "2026": { defaultRate: 5750, raiseMonth: 10, newRate: 5950 },
        "2027": { defaultRate: 5950 }
    };

    const TAX_RULES_REGISTRY = {
        2026: { zusRate: 0.1371, nfzRate: 0.09, pitRate: 0.12, kwotaWolna: 300.00, benefitZusNfz: 30.25, benefitTax: 54.00 },
        2027: { zusRate: 0.1371, nfzRate: 0.09, pitRate: 0.12, kwotaWolna: 300.00, benefitZusNfz: 30.25, benefitTax: 54.00 }
    };

    const COMPANY_RULES_REGISTRY = {
        fiege: { nightBaseSalary: 4806.00, nightBonusPercent: 0.20, weekendBonus: 100.00, overtimeMultiplier: 2.0, laundryMax: 16.00, ppkRate: 0.02, extraInsurance: 36.70 }
    };

    const DICTIONARIES = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)", 
            schedDays: "Графік", vacationDays: "Відпустка (днів)", urlopBonus: "Сума відпустки (zł) ℹ️", 
            bloodDonation: "Донація крові (днів)", bloodBonus: "Сума донації (zł) ℹ️", 
            l4Days: "Лікарняний L4 (календарні)", l4Missed: "Пропущено змін (шт) ℹ️", bonus: "Премія", morning: "Ранкові зміни (шт)", 
            afternoon: "Денні зміни (шт)", night: "Нічні зміни (шт)", weekend: "Робочі сб / нд (днів)", 
            overtime: "Надгодини (днів)", under26: "Вік до 26 років", ppk: "Участь у PPK", 
            insurance: "Дод. страхування", yes: "Так", no: "Ні", menuTitle: "Меню", menuLang: "Мова", menuTheme: "Тема", 
            optThemeLight: "Світла", optThemeDark: "Темна", lblCloudHeader: "Акаунт & Хмара", btnRegister: "Реєстрація",
            btnSyncUp: "Зберегти місяць ☁️", btnSyncDown: "Завантажити місяць 📥", btnLogout: "Вийти (Гостьовий режим)",
            monthNames: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka (zł)", 
            schedDays: "Grafik", vacationDays: "Urlop (dni)", urlopBonus: "Kwota urlopu (zł) ℹ️", 
            bloodDonation: "Oddanie krwi (dni)", bloodBonus: "Kwota za krew (zł) ℹ️", 
            l4Days: "L4 (dni kalendarzowe)", l4Missed: "Przegapione zmiany (szt) ℹ️", bonus: "Premia", morning: "Poranne zmiany (szt)", 
            afternoon: "Dzienne zmiany (szt)", night: "Nocne zmiany (szt)", weekend: "Weekendy (dni)", 
            overtime: "Nadgodziny (dni)", under26: "Wiek < 26 lat", ppk: "PPK", 
            insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie", menuTitle: "Menu", menuLang: "Język", menuTheme: "Motyw",
            optThemeLight: "Jasny", optThemeDark: "Ciemny", lblCloudHeader: "Konto & Chmura", btnRegister: "Rejestracja",
            btnSyncUp: "Zapisz miesiąc ☁️", btnSyncDown: "Pobierz miesiąc 📥", btnLogout: "Wyloguj (Gość)",
            monthNames: ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"]
        }
    };

    // ==========================================
    // ЧИСТИЙ ДЕТЕРМІНОВАНИЙ PAYROLL ENGINE (V2)
    // ==========================================
    function calculateSalary(state, rules) {
        const { taxRules, companyRules, calendarRules } = rules;
        const monthKey = state.month;
        const calendar = calendarRules[monthKey] || calendarRules["default"];
        const stateDays = calendar.workingDays;

        let regWorkedDays = state.shifts.morning + state.shifts.afternoon + state.shifts.night;
        if (state.isShiftsEmpty) {
            regWorkedDays = Math.max(0, state.scheduleDays - state.absences.vacationDays - state.absences.bloodDonationDays - state.absences.l4MissedShifts);
        }
        
        const overtimeDays = Math.min(state.extras.overtimeDays, regWorkedDays); 
        const scheduleDays = state.scheduleDays;

        let adjustedBase = state.salary.base;
        let l4Pay = 0;
        
        if (state.absences.l4Days > 0) {
            adjustedBase = state.salary.base - ((state.salary.base / 30) * state.absences.l4Days);
            const fallbackL4Rate = (state.salary.base * (1 - taxRules.zusRate)) / 30;
            const l4DailyRate = state.cachedL4DailyRate > 0 ? state.cachedL4DailyRate : fallbackL4Rate;
            l4Pay = l4DailyRate * 0.80 * state.absences.l4Days;
        }

        const bonusAmount = scheduleDays > 0 
            ? ((state.salary.base * (state.salary.bonusPct / 100)) / scheduleDays * regWorkedDays) 
            : (state.salary.base * (state.salary.bonusPct / 100));

        const nightTariff = Math.round(((companyRules.nightBaseSalary / (stateDays * 8)) * companyRules.nightBonusPercent) * 100) / 100;
        const overtimeTariff = Math.round(((state.salary.base / stateDays) * companyRules.overtimeMultiplier) * 100) / 100;

        const totalNightPay = Math.round((state.shifts.morning * (10/60) * nightTariff) * 100) / 100 
                            + (state.shifts.night * 8 * nightTariff) 
                            + (state.shifts.night * 30);
                            
        const totalWeekendPay = state.extras.weekendDays * companyRules.weekendBonus;
        const totalOvertimePay = overtimeDays * overtimeTariff;

        const totalUrlopPay = state.absences.vacationDays > 0 ? state.absences.totalUrlopPay : 0;
        const bloodDonationPay = state.absences.bloodDonationDays > 0 ? state.absences.totalBloodPay : 0;

        const gross = adjustedBase + l4Pay + bonusAmount + totalNightPay + totalWeekendPay + totalOvertimePay + totalUrlopPay + bloodDonationPay;

        const zusBase = gross - l4Pay;
        const zus = zusBase * taxRules.zusRate;
        const healthBase = gross - zus;
        const nfz = Math.round((healthBase * taxRules.nfzRate) * 100) / 100;
        
        let pit = 0;
        if (!state.deductions.under26) {
            const pitBase = Math.round(Math.max(0, healthBase - taxRules.kwotaWolna));
            pit = Math.max(0, Math.round((pitBase * taxRules.pitRate) - taxRules.kwotaWolna));
        }

        const totalBenefitCost = taxRules.benefitZusNfz + taxRules.benefitTax;
        const laundryAllowance = scheduleDays > 0 
            ? Math.min(companyRules.laundryMax, (regWorkedDays / scheduleDays) * companyRules.laundryMax) 
            : 0;
        
        const ppkCost = state.deductions.ppk ? gross * companyRules.ppkRate : 0;
        const insuranceCost = state.deductions.insurance ? companyRules.extraInsurance : 0;

        const net = gross - zus - nfz - pit - ppkCost - insuranceCost - totalBenefitCost + laundryAllowance;

        return {
            schemaVersion: 2,
            month: monthKey,
            breakdown: {
                gross: {
                    base: adjustedBase,
                    l4: l4Pay,
                    bonus: bonusAmount,
                    night: totalNightPay,
                    weekend: totalWeekendPay,
                    overtime: totalOvertimePay,
                    vacation: totalUrlopPay,
                    bloodDonation: bloodDonationPay,

                },

            },
            metadata: {
                autoDailyBloodRate: scheduleDays > 0 ? ((bonusAmount + totalNightPay + totalWeekendPay + totalOvertimePay) / scheduleDays) : (state.salary.base / stateDays)
            }
        };
    }

    // ==========================================
    // STATE МЕНЕДЖМЕНТ ТА DOM АДАПТЕР

    async function loadCloudData() {
        if (!auth.currentUser) return;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return;

        try {
            const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", monthVal));
            if (snap.exists()) {
                const d = snap.data();
                if(d.state) {
                    Object.assign(state, d.state);
                    syncStateToDOM();
                } else {
                    // Міграція зі старої схеми якщо присутня
                    document.querySelectorAll('input, select').forEach(el => {
                        if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id) && d[el.id] !== undefined) el.value = d[el.id];
                    });
                    syncDOMToState();
                }
            } else { clearInputs(); syncDOMToState(); }
            await updateL4Cache(monthVal);
            runCalculation();
        } catch(e) { console.error("Помилка завантаження", e); }
    }

    document.getElementById('btn-sync-down').addEventListener('click', async () => { await loadCloudData(); alert("Дані завантажені з хмари! 📥"); });

    function clearInputs() {
        document.querySelectorAll('input[type=number]').forEach(el => el.value = '');

    window.toggleMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }

    window.setLang = function(lang) {
        currentLang = lang; const d = DICTIONARIES[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;

        });

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '';
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); 
        const dNames = DICTIONARIES[currentLang].monthNames;
        
        for(let i = 1; i >= -11; i--) {
            let d = new Date(currentYear, currentMonth + i, 1);
            let y = d.getFullYear();
            let m = d.getMonth();
            let val = y + "-" + String(m + 1).padStart(2, '0');
            let opt = document.createElement('option');
            opt.value = val; opt.text = dNames[m] + " " + y;
            select.appendChild(opt);
        }
        if(!currentVal) select.value = currentYear + "-" + String(currentMonth + 1).padStart(2, '0');
        else select.value = currentVal;
        
        state.month = select.value;
    }

    function syncDOMToState() {
        state.month = document.getElementById('monthSelect').value;
        state.scheduleDays = parseInt(document.getElementById('scheduleDays').value) || 21;
        state.salary.base = Math.max(0, parseFloat(document.getElementById('baseSalary').value) || 5750);
        state.salary.bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        
        state.shifts.morning = Math.max(0, parseInt(document.getElementById('morningShifts').value) || 0);
        state.shifts.afternoon = Math.max(0, parseInt(document.getElementById('afternoonShifts').value) || 0);
        state.shifts.night = Math.max(0, parseInt(document.getElementById('nightShifts').value) || 0);
        
        state.extras.weekendDays = Math.max(0, parseInt(document.getElementById('weekendDays').value) || 0);
        state.extras.overtimeDays = Math.max(0, parseFloat(document.getElementById('overtimeDays').value) || 0);
        
        state.absences.vacationDays = isPremium ? Math.max(0, parseInt(document.getElementById('vacationDays').value) || 0) : 0;
        state.absences.totalUrlopPay = Math.max(0, parseFloat(document.getElementById('urlopBonus').value) || 0);
        
        state.absences.bloodDonationDays = isPremium ? Math.max(0, parseInt(document.getElementById('bloodDonationDays').value) || 0) : 0;
        state.absences.totalBloodPay = Math.max(0, parseFloat(document.getElementById('bloodBonus').value) || 0);
        
        state.absences.l4Days = isPremium ? Math.max(0, parseInt(document.getElementById('l4Days').value) || 0) : 0;
        state.absences.l4MissedShifts = Math.max(0, parseInt(document.getElementById('l4MissedShifts').value) || 0);
        
        state.deductions.under26 = document.getElementById('under26Select').value === 'yes';
        state.deductions.ppk = document.getElementById('ppkSelect').value === 'yes';
        state.deductions.insurance = document.getElementById('insuranceSelect').value === 'yes';
        
        state.isShiftsEmpty = (document.getElementById('morningShifts').value === '' && document.getElementById('afternoonShifts').value === '' && document.getElementById('nightShifts').value === '');
        state.cachedL4DailyRate = window.cachedL4DailyRate;
    }

    function syncStateToDOM() {
        document.getElementById('monthSelect').value = state.month || document.getElementById('monthSelect').value;
        document.getElementById('scheduleDays').value = state.scheduleDays;
        document.getElementById('baseSalary').value = state.salary.base;
        document.getElementById('bonusPctSelect').value = state.salary.bonusPct;
        document.getElementById('morningShifts').value = state.shifts.morning || '';
        document.getElementById('afternoonShifts').value = state.shifts.afternoon || '';
        document.getElementById('nightShifts').value = state.shifts.night || '';
        document.getElementById('weekendDays').value = state.extras.weekendDays || '';
        document.getElementById('overtimeDays').value = state.extras.overtimeDays || '';
        document.getElementById('vacationDays').value = state.absences.vacationDays || '';
        document.getElementById('urlopBonus').value = state.absences.totalUrlopPay || '';
        document.getElementById('bloodDonationDays').value = state.absences.bloodDonationDays || '';
        document.getElementById('bloodBonus').value = state.absences.totalBloodPay || '';
        document.getElementById('l4Days').value = state.absences.l4Days || '';
        document.getElementById('l4MissedShifts').value = state.absences.l4MissedShifts || '';
        document.getElementById('under26Select').value = state.deductions.under26 ? 'yes' : 'no';
        document.getElementById('ppkSelect').value = state.deductions.ppk ? 'yes' : 'no';
        document.getElementById('insuranceSelect').value = state.deductions.insurance ? 'yes' : 'no';
    }

    async function updateL4Cache(currentMonthVal) {
        if (!auth.currentUser) { window.cachedL4DailyRate = null; return; }
        const [yStr, mStr] = currentMonthVal.split('-');
        let cYear = parseInt(yStr); let cMonth = parseInt(mStr);
        let totalNetBase = 0; let monthsFound = 0;
        
        for (let i = 1; i <= 12; i++) {
            let pMonth = cMonth - i; let pYear = cYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastStr = pYear + "-" + String(pMonth).padStart(2, '0');
            try {
                const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastStr));
                if (snap.exists()) {
                    const d = snap.data();
                    const pastState = d.state || {};
                    const pBase = Math.max(0, parseFloat(pastState.salary?.base) || 5750);
                    let pPct = parseFloat(pastState.salary?.bonusPct); if (isNaN(pPct)) pPct = 15;
                    const mS = Math.max(0, parseInt(pastState.shifts?.morning) || 0);
                    const aS = Math.max(0, parseInt(pastState.shifts?.afternoon) || 0);
                    const nS = Math.max(0, parseInt(pastState.shifts?.night) || 0);
                    const over = Math.max(0, parseFloat(pastState.extras?.overtimeDays) || 0);
                    const wknd = Math.max(0, parseInt(pastState.extras?.weekendDays) || 0);
                    const vac = Math.max(0, parseInt(pastState.absences?.vacationDays) || 0);
                    const blood = Math.max(0, parseInt(pastState.absences?.bloodDonationDays) || 0);
                    const l4m = Math.max(0, parseInt(pastState.absences?.l4MissedShifts) || 0);
                    
                    let regWorked = mS + aS + nS; const pSched = parseInt(pastState.scheduleDays) || 21;
                    if (mS === 0 && aS === 0 && nS === 0) regWorked = Math.max(0, pSched - vac - blood - l4m);
                    
                    const bonusAm = pSched > 0 ? (pBase * (pPct / 100)) / pSched * regWorked : 0;
                    const nTariff = ((COMPANY_RULES_REGISTRY.fiege.nightBaseSalary / (21 * 8)) * COMPANY_RULES_REGISTRY.fiege.nightBonusPercent); 
                    const nightAm = (mS * (10/60) * nTariff) + (nS * 8 * nTariff) + (nS * 30);
                    const wkndAm = wknd * 100; const overAm = over * ((pBase / 21) * 2);
                    
                    let grossBase = pBase + bonusAm + nightAm + wkndAm + overAm;
                    let netZus = grossBase * (1 - TAX_RULES_REGISTRY[2026].zusRate); 
                    totalNetBase += netZus; monthsFound++;
                }
            } catch(e) {}
        }
        window.cachedL4DailyRate = monthsFound > 0 ? (totalNetBase / monthsFound) / 30 : null;
    }

    async function getAutoHourlyUrlopRate(currentYear, monthIdx) {
        if (!auth.currentUser) return 0;
        let totalExtras = 0; let totalWorkedHours = 0;
        
        for (let i = 1; i <= 3; i++) {
            let pMonth = monthIdx + 1 - i; let pYear = currentYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastMonthStr = pYear + "-" + String(pMonth).padStart(2, '0');
            const calRule = CALENDAR_REGISTRY[pastMonthStr] || CALENDAR_REGISTRY["default"];
            const stDays = calRule.workingDays;
            
            try {
                const docSnap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastMonthStr));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const pastState = data.state || {};
                    const pastBase = Math.max(0, parseFloat(pastState.salary?.base) || 5750);
                    let pastPct = parseFloat(pastState.salary?.bonusPct); if (isNaN(pastPct)) pastPct = 15;
                    const mS = Math.max(0, parseInt(pastState.shifts?.morning) || 0); 
                    const aS = Math.max(0, parseInt(pastState.shifts?.afternoon) || 0);
                    const nS = Math.max(0, parseInt(pastState.shifts?.night) || 0); 
                    const wknd = Math.max(0, parseInt(pastState.extras?.weekendDays) || 0);
                    const rawOver = Math.max(0, parseFloat(pastState.extras?.overtimeDays) || 0);
                    
                    let regWorkedDays = mS + aS + nS; const pastSched = parseInt(pastState.scheduleDays) || stDays;
                    const l4m = Math.max(0, parseInt(pastState.absences?.l4MissedShifts) || 0); 
                    const vac = Math.max(0, parseInt(pastState.absences?.vacationDays) || 0);
                    const blood = Math.max(0, parseInt(pastState.absences?.bloodDonationDays) || 0);
                    
                    if (mS === 0 && aS === 0 && nS === 0) {
                        regWorkedDays = Math.max(0, pastSched - vac - blood - l4m);
                    }
                    const over = Math.min(rawOver, regWorkedDays); 
                    let pActualDays = regWorkedDays + over;
                    
                    const pastBonusVal = pastSched > 0 ? (pastBase * (pastPct / 100)) / pastSched * regWorkedDays : 0;
                    const nTariff = ((COMPANY_RULES_REGISTRY.fiege.nightBaseSalary / (stDays * 8)) * COMPANY_RULES_REGISTRY.fiege.nightBonusPercent);
                    const pastNight = (mS * (10/60) * nTariff) + (nS * 8 * nTariff) + (nS * 30);
                    const pastWknd = wknd * 100; const pastOver = over * ((pastBase / stDays) * 1.5);

                    totalExtras += (pastBonusVal + pastNight + pastWknd + pastOver);
                    totalWorkedHours += (pActualDays * 8);
                }
            } catch (e) {}
        }
        if (totalWorkedHours === 0) return 0;
        return (totalExtras / totalWorkedHours);
    }

    // ПОДІЯ: Відпустка
    document.getElementById('vacationDays').addEventListener('input', async function() {
        const vacDays = Math.max(0, parseInt(this.value) || 0);
        const urlopInput = document.getElementById('urlopBonus');
        if (vacDays === 0 || this.value === '') { 
            state.absences.totalUrlopPay = 0;
            urlopInput.value = ""; 
        } else if (isPremium) {
            const monthVal = document.getElementById('monthSelect').value;
            if (monthVal) {
                const [year, month] = monthVal.split('-');
                const autoHourly = await getAutoHourlyUrlopRate(parseInt(year), parseInt(month) - 1);
                if (autoHourly > 0) {
                    const totalVacationSum = autoHourly * (vacDays * 8);
                    state.absences.totalUrlopPay = totalVacationSum;
                    urlopInput.value = totalVacationSum.toFixed(2);
                }
            }
        }
        runCalculation();
    });

    document.getElementById('urlopBonus').addEventListener('input', function() {
        state.absences.totalUrlopPay = Math.max(0, parseFloat(this.value) || 0);
        runCalculation();
    });

    // ПОДІЯ: Донація крові
    document.getElementById('bloodDonationDays').addEventListener('input', function() {
        const bloodDays = Math.max(0, parseInt(this.value) || 0);
        const bloodInput = document.getElementById('bloodBonus');
        if (bloodDays === 0 || this.value === '') { 
            state.absences.totalBloodPay = 0;
            bloodInput.value = ""; 
        } else {
            syncDOMToState();
            // Тестовий прогін для визначення денної ставки
            const rules = {
                taxRules: TAX_RULES_REGISTRY[2026],
                companyRules: COMPANY_RULES_REGISTRY.fiege,
                calendarRules: CALENDAR_REGISTRY
            };
            const tempResult = calculateSalary(state, rules);
            const totalBloodSum = tempResult.metadata.autoDailyBloodRate * bloodDays;
            state.absences.totalBloodPay = totalBloodSum;
            bloodInput.value = totalBloodSum.toFixed(2);
        }
        runCalculation();
    });

    document.getElementById('bloodBonus').addEventListener('input', function() {
        state.absences.totalBloodPay = Math.max(0, parseFloat(this.value) || 0);
        runCalculation();
    });

    // Реактивність графіка
    ['morningShifts', 'afternoonShifts', 'nightShifts', 'vacationDays', 'bloodDonationDays', 'l4MissedShifts'].forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            el.addEventListener('input', () => {
                if(isPremium) {
                    const m = Math.max(0, parseInt(document.getElementById('morningShifts').value) || 0);
                    const a = Math.max(0, parseInt(document.getElementById('afternoonShifts').value) || 0);
                    const n = Math.max(0, parseInt(document.getElementById('nightShifts').value) || 0);
                    const vac = Math.max(0, parseInt(document.getElementById('vacationDays').value) || 0);
                    const blood = Math.max(0, parseInt(document.getElementById('bloodDonationDays').value) || 0);
                    const l4m = Math.max(0, parseInt(document.getElementById('l4MissedShifts').value) || 0);
                    
                    const mStr = document.getElementById('morningShifts').value;
                    const aStr = document.getElementById('afternoonShifts').value;
                    const nStr = document.getElementById('nightShifts').value;
                    const vStr = document.getElementById('vacationDays').value;
                    const bStr = document.getElementById('bloodDonationDays').value;
                    const lStr = document.getElementById('l4MissedShifts').value;

                    if (mStr !== '' || aStr !== '' || nStr !== '' || vStr !== '' || bStr !== '' || lStr !== '') {
                        let autoSched = m + a + n + vac + blood + l4m;
                        document.getElementById('scheduleDays').value = autoSched > 0 ? autoSched : "";
                    } else {
                        document.getElementById('scheduleDays').value = "";
                    }
                }
                syncDOMToState();
                runCalculation();
            });
        }
    });

    function runCalculation() {
        syncDOMToState();
        
        // Визначення ставки за роком/місяцем з динамічного реєстру
        const [yStr, mStr] = state.month.split('-');
        const yearRates = SALARY_RATES_REGISTRY[yStr] || { defaultRate: 5750 };
        const monthNum = parseInt(mStr);
        const autoBase = (yearRates.raiseMonth && monthNum >= yearRates.raiseMonth) ? yearRates.newRate : yearRates.defaultRate;
        
        let baseInput = document.getElementById('baseSalary');
        if (!baseInput.value && autoBase) {
            baseInput.value = autoBase;
            state.salary.base = autoBase;
        }

        const rules = {
            taxRules: TAX_RULES_REGISTRY[yStr] || TAX_RULES_REGISTRY[2026],
            companyRules: COMPANY_RULES_REGISTRY.fiege,
            calendarRules: CALENDAR_REGISTRY
        };

        const result = calculateSalary(state, rules);

        document.getElementById('urlopBonusGroup').classList.toggle('hidden', state.absences.vacationDays === 0);
        document.getElementById('bloodBonusGroup').classList.toggle('hidden', state.absences.bloodDonationDays === 0);
        document.getElementById('l4MissedGroup').classList.toggle('hidden', state.absences.l4Days === 0);

        document.getElementById('grossResult').innerText = result.breakdown.gross.total.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = result.breakdown.net.toFixed(2) + ' zł';
    }

    // UX фокус
    document.querySelectorAll('input[type=number]').forEach(el => {
        el.addEventListener('focus', function() { this.select(); });
    });

    document.querySelectorAll('input, select').forEach(el => {
        if(!['langSelect', 'themeSelect', 'email', 'password', 'vacationDays', 'bloodDonationDays', 'urlopBonus', 'bloodBonus', 'l4Days', 'l4MissedShifts', 'monthSelect', 'scheduleDays', 'morningShifts', 'afternoonShifts', 'nightShifts'].includes(el.id)) {
            el.addEventListener('input', () => { syncDOMToState(); runCalculation(); }); 
            el.addEventListener('change', () => { syncDOMToState(); runCalculation(); });
        }
    });
    
    document.getElementById('scheduleDays').addEventListener('input', () => { syncDOMToState(); runCalculation(); });
    document.getElementById('monthSelect').addEventListener('change', async () => { 
        state.month = document.getElementById('monthSelect').value;
        await loadCloudData(); 
    });

    setTheme(localStorage.getItem('theme') || 'light');
    initMonths();
    window.setLang('ua');
</script>
