<script type="module">
    /* ==========================================
       БЛОК 3: НАЛАШТУВАННЯ ТА БАЗА ДАНИХ FIREBASE
       ========================================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
        authDomain: "my-salary-9ea25.firebaseapp.com",
        projectId: "my-salary-9ea25",
        storageBucket: "my-salary-9ea25.firebasestorage.app",
        messagingSenderId: "412323283290",
        appId: "1:412323283290:web:b4706af670a57776333363"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentLang = 'ua';
    let isPremium = false;
    window.cachedL4DailyRate = null; 

    onAuthStateChanged(auth, async (user) => {
        isPremium = !!user;
        document.getElementById('app-body').classList.toggle('is-logged-in', isPremium);
        document.getElementById('auth-container').classList.toggle('hidden', isPremium);
        document.getElementById('sync-container').classList.toggle('hidden', !isPremium);
        
        if(user) {
            document.getElementById('user-email-display').innerText = "👤 " + user.email;
            await loadCloudData(); 
        } else {
            clearInputs();
        }
        calculateSalary();
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert("Помилка входу: " + e.message); }
    });
    document.getElementById('btn-register').addEventListener('click', async () => {
        try { await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); alert("Реєстрація успішна!"); } 
        catch (e) { alert("Помилка: " + e.message); }
    });
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    document.getElementById('btn-sync-up').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) { alert("Оберіть місяць!"); return; }

        const data = { updatedAt: new Date().toISOString() };
        document.querySelectorAll('input, select').forEach(el => {
            if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id)) data[el.id] = el.value;
        });

        try {
            await setDoc(doc(db, "users", auth.currentUser.uid, "months", monthVal), data, { merge: true });
            alert("Дані збережені у хмару! ☁️");
            await updateL4Cache(monthVal); 
        } catch (error) { alert("Помилка збереження: " + error.message); }
    });

    async function loadCloudData() {
        if (!auth.currentUser) return;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return;

        try {
            const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", monthVal));
            if (snap.exists()) {
                const d = snap.data();
                document.querySelectorAll('input, select').forEach(el => {
                    if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id) && d[el.id] !== undefined) el.value = d[el.id];
                });
            } else {
                clearInputs();
            }
            await updateL4Cache(monthVal); 
            calculateSalary();
        } catch(e) {
            console.error("Помилка", e);
        }
    }

    document.getElementById('btn-sync-down').addEventListener('click', async () => {
        await loadCloudData();
        alert("Дані завантажені з хмари! 📥");
    });

    function clearInputs() {
        document.querySelectorAll('input[type=number]').forEach(el => el.value = '');
        document.getElementById('bonusPctSelect').value = "15";
        document.getElementById('baseSalary').value = "";
    }

    /* ==========================================
       БЛОК 4: СЛОВНИКИ ТА ЗМІННІ 
       ========================================== */
    const dict = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)", 
            schedDays: "Графік", vacationDays: "Відпустка (днів)", urlopBonus: "Середня за 1 день відп. (zł) ℹ️", 
            l4Days: "Лікарняний L4 (календарні)", bonus: "Премія", morning: "Ранкові зміни (шт)", 
            afternoon: "Денні зміни (шт)", night: "Нічні зміни (шт)", weekend: "Робочі сб / нд (днів)", 
            overtime: "Надгодини (днів)", under26: "Вік до 26 років", ppk: "Участь у PPK", 
            insurance: "Дод. страхування", yes: "Так", no: "Ні",
            menuTitle: "Меню", menuLang: "Мова", menuTheme: "Тема", 
            monthNames: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka (zł)", 
            schedDays: "Grafik", vacationDays: "Urlop (dni)", urlopBonus: "Średnia urlopowa za 1 dzień ℹ️", 
            l4Days: "L4 (dni kalendarzowe)", bonus: "Premia", morning: "Poranne zmiany (szt)", 
            afternoon: "Dzienne zmiany (szt)", night: "Nocne zmiany (szt)", weekend: "Weekendy (dni)", 
            overtime: "Nadgodziny (dni)", under26: "Wiek < 26 lat", ppk: "PPK", 
            insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie",
            menuTitle: "Menu", menuLang: "Język", menuTheme: "Motyw",
            monthNames: ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"]
        }
    };

    const stateWorkDays = [20, 20, 22, 21, 20, 21, 23, 20, 22, 22, 20, 20];

    window.toggleMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }
    window.setTheme = function(theme) { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : ''); localStorage.setItem('theme', theme); }
    window.setLang = function(lang) {
        currentLang = lang; const d = dict[lang];
        document.getElementById('lblTitle').innerHTML = d.title + ' <span class="premium-badge">PRO</span>';
        document.getElementById('lblMonth').innerText = d.month; document.getElementById('lblBase').innerText = d.base;
        document.getElementById('lblScheduleDays').innerText = d.schedDays;
        document.getElementById('lblVacationDays').innerText = d.vacationDays; document.getElementById('lblUrlopBonus').innerText = d.urlopBonus;
        document.getElementById('lblL4Days').innerText = d.l4Days; 
        document.getElementById('lblBonus').innerText = d.bonus; document.getElementById('lblMorning').innerText = d.morning;
        document.getElementById('lblAfternoon').innerText = d.afternoon; document.getElementById('lblNight').innerText = d.night; 
        document.getElementById('lblWeekend').innerText = d.weekend; document.getElementById('lblOvertime').innerText = d.overtime; 
        document.getElementById('lblUnder26').innerText = d.under26; document.getElementById('lblPPK').innerText = d.ppk; 
        document.getElementById('lblInsurance').innerText = d.insurance; document.getElementById('menuTitle').innerText = d.menuTitle; 
        document.getElementById('lblMenuLang').innerText = d.menuLang; document.getElementById('lblMenuTheme').innerText = d.menuTheme; 
        document.getElementById('optU26Yes').innerText = d.yes; document.getElementById('optU26No').innerText = d.no; 
        document.getElementById('optPpkYes').innerText = d.yes; document.getElementById('optPpkNo').innerText = d.no; 
        document.getElementById('optInsYes').innerText = d.yes; document.getElementById('optInsNo').innerText = d.no;
        initMonths(); calculateSalary();
    }

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '';
        
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); 
        const dNames = dict[currentLang].monthNames;
        
        for(let i = 1; i >= -11; i--) {
            let d = new Date(currentYear, currentMonth + i, 1);
            let y = d.getFullYear();
            let m = d.getMonth();
            let val = y + "-" + String(m + 1).padStart(2, '0');
            
            let opt = document.createElement('option');
            opt.value = val;
            opt.text = dNames[m] + " " + y;
            select.appendChild(opt);
        }
        
        if(!currentVal) {
            select.value = currentYear + "-" + String(currentMonth + 1).padStart(2, '0');
        } else {
            select.value = currentVal;
        }
    }

    async function updateL4Cache(currentMonthVal) {
        if (!auth.currentUser) { window.cachedL4DailyRate = null; return; }
        
        const [yStr, mStr] = currentMonthVal.split('-');
        let cYear = parseInt(yStr);
        let cMonth = parseInt(mStr);
        
        let totalNetBase = 0;
        let monthsFound = 0;
        
        for (let i = 1; i <= 12; i++) {
            let pMonth = cMonth - i;
            let pYear = cYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastStr = pYear + "-" + String(pMonth).padStart(2, '0');
            
            try {
                const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastStr));
                if (snap.exists()) {
                    const data = snap.data();
                    const pBase = parseFloat(data.baseSalary) || 5750;
                    let pPct = parseFloat(data.bonusPctSelect);
                    if (isNaN(pPct)) pPct = 15;
                    
                    const mS = parseInt(data.morningShifts) || 0;
                    const aS = parseInt(data.afternoonShifts) || 0;
                    const nS = parseInt(data.nightShifts) || 0;
                    const over = parseFloat(data.overtimeDays) || 0;
                    const wknd = parseInt(data.weekendDays) || 0;
                    const vac = parseInt(data.vacationDays) || 0;
                    const l4m = parseInt(data.l4MissedShifts) || 0;
                    
                    let autoSched = (mS + aS + nS) - over + vac + l4m;
                    const pSched = autoSched > 0 ? autoSched : 21;
                    
                    let pActual = mS + aS + nS;
                    if (!data.morningShifts && !data.afternoonShifts && !data.nightShifts) {
                        pActual = Math.max(0, pSched - vac - l4m);
                    }
                    let bWorked = Math.max(0, pActual - over);
                    
                    const bonusAm = pSched > 0 ? (pBase * (pPct / 100)) / pSched * bWorked : 0;
                    const nTariff = ((4806 / (21 * 8)) * 0.20); 
                    const nightAm = (mS * (10/60) * nTariff) + (nS * 8 * nTariff) + (nS * 30);
                    const wkndAm = wknd * 100;
                    const overAm = over * ((pBase / 21) * 2);
                    
                    let grossBase = pBase + bonusAm + nightAm + wkndAm + overAm;
                    let netZus = grossBase * 0.8629; 
                    
                    totalNetBase += netZus;
                    monthsFound++;
                }
            } catch(e) {}
        }
        
        if (monthsFound > 0) {
            window.cachedL4DailyRate = (totalNetBase / monthsFound) / 30; 
        } else {
            window.cachedL4DailyRate = null;
        }
    }

    async function getAutoDailyUrlopBonus(currentYear, monthIdx) {
        if (!auth.currentUser) return 0;
        let totalExtras = 0; let totalWorkedDays = 0;
        
        for (let i = 1; i <= 3; i++) {
            let pMonth = monthIdx + 1 - i; let pYear = currentYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastMonthStr = pYear + "-" + String(pMonth).padStart(2, '0');
            const stDays = stateWorkDays[pMonth - 1] || 21;
            
            try {
                const docSnap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastMonthStr));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const pastBase = parseFloat(data.baseSalary) || 5750;
                    let pastPct = parseFloat(data.bonusPctSelect);
                    if (isNaN(pastPct)) pastPct = 15;
                    
                    const mShifts = parseInt(data.morningShifts) || 0;
                    const aShifts = parseInt(data.afternoonShifts) || 0;
                    const nShifts = parseInt(data.nightShifts) || 0;
                    const wknd = parseInt(data.weekendDays) || 0;
                    const over = parseFloat(data.overtimeDays) || 0;
                    
                    let pActual = mShifts + aShifts + nShifts;
                    const pastSched = parseInt(data.scheduleDays) || stDays;
                    
                    const l4m = parseInt(data.l4MissedShifts) || 0;
                    const vac = parseInt(data.vacationDays) || 0;
                    if (!data.morningShifts && !data.afternoonShifts && !data.nightShifts) {
                        pActual = Math.max(0, pastSched - vac - l4m);
                    }
                    
                    let baseWorkedForBonus = Math.max(0, pActual - over);
                    const pastBonusVal = pastSched > 0 ? (pastBase * (pastPct / 100)) / pastSched * baseWorkedForBonus : 0;
                    
                    const nTariff = ((4806 / (stDays * 8)) * 0.20);
                    const pastNight = (mShifts * (10/60) * nTariff) + (nShifts * 8 * nTariff) + (nShifts * 30);
                    const pastWknd = wknd * 100;
                    const pastOver = over * ((pastBase / stDays) * 2);

                    totalExtras += (pastBonusVal + pastNight + pastWknd + pastOver);
                    totalWorkedDays += pActual;
                }
            } catch (e) {}
        }
        if (totalWorkedDays === 0) return 0;
        return (totalExtras / totalWorkedDays);
    }

    document.getElementById('vacationDays').addEventListener('input', async function() {
        const vacDays = parseInt(this.value) || 0;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return;
        const [year, month] = monthVal.split('-');
        const urlopInput = document.getElementById('urlopBonus');
        
        if (isPremium && vacDays > 0) {
            if (!urlopInput.value || parseFloat(urlopInput.value) === 0) {
                const autoDaily = await getAutoDailyUrlopBonus(parseInt(year), parseInt(month) - 1);
                if (autoDaily > 0) urlopInput.value = autoDaily.toFixed(2);
            }
        } else { 
            urlopInput.value = ""; 
        }
        calculateSalary();
    });

    document.getElementById('l4Days').addEventListener('input', function() {
        if(isPremium) {
            const l4 = parseInt(this.value) || 0;
            const bonusSelect = document.getElementById('bonusPctSelect');
            
            if (l4 === 0) {
                bonusSelect.value = "15";
                document.getElementById('l4MissedShifts').value = ""; 
            }
            else if (l4 <= 2) bonusSelect.value = "12.5";
            else bonusSelect.value = "10";
            calculateSalary();
        }
    });

    ['morningShifts', 'afternoonShifts', 'nightShifts', 'overtimeDays', 'vacationDays', 'l4MissedShifts'].forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            el.addEventListener('input', () => {
                if(isPremium) {
                    const mStr = document.getElementById('morningShifts').value;
                    const aStr = document.getElementById('afternoonShifts').value;
                    const nStr = document.getElementById('nightShifts').value;
                    
                    const m = parseInt(mStr) || 0;
                    const a = parseInt(aStr) || 0;
                    const n = parseInt(nStr) || 0;
                    const over = parseFloat(document.getElementById('overtimeDays').value) || 0;
                    const vac = parseInt(document.getElementById('vacationDays').value) || 0;
                    const l4Missed = parseInt(document.getElementById('l4MissedShifts').value) || 0; 
                    
                    // Перераховуємо графік ТІЛЬКИ якщо хоча б одна зміна введена
                    if (mStr !== '' || aStr !== '' || nStr !== '') {
                        let autoSched = (m + a + n) - over + vac + l4Missed;
                        if(autoSched > 0) {
                            document.getElementById('scheduleDays').value = autoSched;
                        } else {
                            document.getElementById('scheduleDays').value = "";
                        }
                    }
                }
                calculateSalary();
            });
        }
    });

    window.calculateSalary = function() {
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return updateUI(0, 0);
        
        const monthIdx = parseInt(monthVal.split('-')[1]) - 1;
        const stateDays = stateWorkDays[monthIdx];
        
        const autoBase = monthIdx >= 9 ? 5950 : 5750;
        let baseInput = document.getElementById('baseSalary');
        if (!baseInput.value) baseInput.value = autoBase;
        const baseSalary = parseFloat(baseInput.value);

        const vacDays = isPremium ? (parseInt(document.getElementById('vacationDays').value) || 0) : 0;
        const l4Days = isPremium ? (parseInt(document.getElementById('l4Days').value) || 0) : 0;
        
        document.getElementById('urlopBonusGroup').classList.toggle('hidden', vacDays === 0);
        document.getElementById('l4MissedGroup').classList.toggle('hidden', l4Days === 0);

        const mStr = document.getElementById('morningShifts').value;
        const aStr = document.getElementById('afternoonShifts').value;
        const nStr = document.getElementById('nightShifts').value;

        const morningShifts = parseInt(mStr) || 0;
        const afternoonShifts = parseInt(aStr) || 0;
        const nightShifts = parseInt(nStr) || 0;
        const overtimeDays = parseFloat(document.getElementById('overtimeDays').value) || 0;
        const weekendDays = parseInt(document.getElementById('weekendDays').value) || 0;
        const l4Missed = parseInt(document.getElementById('l4MissedShifts').value) || 0;

        let actualWorkedDays = morningShifts + afternoonShifts + nightShifts;
        let schedDays = isPremium ? (parseInt(document.getElementById('scheduleDays').value) || stateDays) : stateDays;

        // ЗАХИСТ: Якщо зміни взагалі не введено, програма припускає повну норму (щоб премія відразу показувалась)
        if (mStr === '' && aStr === '' && nStr === '') {
            actualWorkedDays = Math.max(0, schedDays - vacDays - l4Missed);
        }

        const dailyUrlopBonus = (isPremium && vacDays > 0) ? (parseFloat(document.getElementById('urlopBonus').value) || 0) : 0;
        const totalUrlopBonus = dailyUrlopBonus * vacDays;

        let adjustedBase = baseSalary; 
        let l4Pay = 0;
        
        if (isPremium && l4Days > 0) {
            adjustedBase = baseSalary - ((baseSalary / 30) * l4Days);
            
            let l4DailyRate = (baseSalary * 0.8629) / 30; 
            if (window.cachedL4DailyRate && window.cachedL4DailyRate > 0) {
                l4DailyRate = window.cachedL4DailyRate; 
            }
            l4Pay = l4DailyRate * 0.80 * l4Days; 
        }

        const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        const baseWorkedForBonus = Math.max(0, actualWorkedDays - overtimeDays);
        const bonusAmount = (isPremium && schedDays > 0) ? ((baseSalary * (bonusPct / 100)) / schedDays * baseWorkedForBonus) : (baseSalary * (bonusPct / 100));

        const nightTariff = Math.round(((4806.00 / (stateDays * 8)) * 0.20) * 100) / 100;
        const overtimeTariff = Math.round(((baseSalary / stateDays) * 2) * 100) / 100;

        const totalNightPay = Math.round((morningShifts * (10/60) * nightTariff) * 100)/100 + (nightShifts * 8 * nightTariff) + (nightShifts * 30);
        const gross = adjustedBase + l4Pay + bonusAmount + totalNightPay + (weekendDays * 100) + (overtimeDays * overtimeTariff) + totalUrlopBonus;

        const isUnder26 = document.getElementById('under26Select').value === 'yes';
        const ppkActive = document.getElementById('ppkSelect').value === 'yes';
        
        const zusBase = gross - l4Pay; const zus = zusBase * 0.1371; 
        const healthBase = gross - zus; const nfz = Math.round((healthBase * 0.09) * 100) / 100;
        
        let pit = 0;
        if (!isUnder26) {
            const pitBase = Math.round(Math.max(0, healthBase - 300.00));
            pit = Math.max(0, Math.round((pitBase * 0.12) - 300.00) + 54.00);
        }

        const net = gross - zus - nfz - pit - (ppkActive ? gross * 0.02 : 0) - (document.getElementById('insuranceSelect').value === 'yes' ? 36.70 : 0) - 30.25 + 15.00;

        updateUI(gross, net);
    }

    function updateUI(g, n) {
        document.getElementById('grossResult').innerText = g.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = n.toFixed(2) + ' zł';
    }

    document.querySelectorAll('input, select').forEach(el => {
        if(!['langSelect', 'themeSelect', 'email', 'password', 'vacationDays', 'l4Days', 'l4MissedShifts', 'monthSelect'].includes(el.id)) {
            el.addEventListener('input', calculateSalary); el.addEventListener('change', calculateSalary);
        }
    });
    
    document.getElementById('monthSelect').addEventListener('change', async () => {
        await loadCloudData();
    });

    setTheme(localStorage.getItem('theme') || 'light');
    window.setLang('ua');
</script>
