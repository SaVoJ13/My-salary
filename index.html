/* =========================================================
   RULES FOR MONTH
   ========================================================= */

function getRulesForMonth(monthStr) {

    if (!monthStr) {
        throw new Error("Місяць не обрано.");
    }

    const [year] = monthStr.split("-");

    const calendar = CALENDAR_REGISTRY[monthStr];

    const tax = TAX_RULES_REGISTRY[year];

    const salaryBase = SALARY_RATES_REGISTRY[monthStr];

    if (!calendar) {
        throw new Error(
            `Відсутні дані календаря для ${monthStr}.`
        );
    }

    if (!tax) {
        throw new Error(
            `Відсутні податкові правила для ${year}.`
        );
    }

    if (salaryBase === undefined) {
        throw new Error(
            `Відсутня базова ставка для ${monthStr}.`
        );
    }

    return {

        calendar,

        tax,

        company: COMPANY_RULES.fiege,

        defaultBase: salaryBase
    };
}


/* =========================================================
   YTD ENGINE
   ========================================================= */

function getYTDTotals(
    targetMonthStr,
    historyObj
) {

    const [targetYear, targetMonth] =
        targetMonthStr.split("-");

    let cumulativeRevenueGrosz = 0;

    let cumulativeIncomeGrosz = 0;

    historyObj.months.forEach(month => {

        const [year, monthNumber] =
            month.month.split("-");

        if (
            year === targetYear &&
            parseInt(monthNumber, 10) <
            parseInt(targetMonth, 10)
        ) {

            cumulativeRevenueGrosz +=
                month.pit0EligibleRevenueGrosz || 0;

            cumulativeIncomeGrosz +=
                month.taxableIncomeGrosz || 0;
        }
    });

    return {

        cumulativeRevenueGrosz,

        cumulativeIncomeGrosz
    };
}


/* =========================================================
   PREVIOUS MONTHS
   ========================================================= */

function getPreviousMonths(
    targetMonthStr,
    count,
    historyObj
) {

    const sorted = [...historyObj.months]
        .sort((a, b) =>
            b.month.localeCompare(a.month)
        );

    return sorted
        .filter(month =>
            month.month < targetMonthStr
        )
        .slice(0, count);
}


/* =========================================================
   ATTENDANCE ENGINE
   ========================================================= */

function calculateAttendance(
    currentState,
    companyRules
) {

    let workedDays = 0;

    let workedHours = 0;

    if (currentState.mode === "shifts") {

        const morning =
            companyRules.shiftMatrix.morning;

        const afternoon =
            companyRules.shiftMatrix.afternoon;

        const night =
            companyRules.shiftMatrix.night;

        workedDays =
            currentState.shifts.morning +
            currentState.shifts.afternoon +
            currentState.shifts.night;

        workedHours =

            currentState.shifts.morning *
            morning.paidHours +

            currentState.shifts.afternoon *
            afternoon.paidHours +

            currentState.shifts.night *
            night.paidHours;

    } else {

        const vacationDays =
            currentState.absences.vacationHours / 8;

        const bloodDays =
            currentState.absences.bloodDonationHours / 8;

        workedDays = Math.max(

            0,

            currentState.scheduleDays -
            vacationDays -
            bloodDays -
            currentState.absences.l4MissedDays

        );

        workedHours =
            workedDays * 8;
    }

    return {

        workedDays,

        workedHours
    };
}


/* =========================================================
   SICKNESS PAY
   ========================================================= */

function calculateSicknessPay(
    targetMonthStr,
    historyObj,
    rules,
    l4Days
) {

    if (l4Days <= 0) {
        return 0;
    }

    const previous12 =
        getPreviousMonths(
            targetMonthStr,
            12,
            historyObj
        );

    if (previous12.length === 0) {
        return 0;
    }

    let totalBasisGrosz = 0;

    previous12.forEach(month => {

        totalBasisGrosz +=
            Number(
                month.sicknessEligibleGrossGrosz
            ) || 0;
    });

    const averageGrossGrosz =
        Math.round(
            totalBasisGrosz /
            previous12.length
        );

    const zusDeductionGrosz =
        Math.round(
            averageGrossGrosz *
            rules.tax.zus.totalEmployee
        );

    const dailyNetBasisGrosz =
        Math.round(
            (
                averageGrossGrosz -
                zusDeductionGrosz
            ) / 30
        );

    return Math.round(
        dailyNetBasisGrosz *
        0.80 *
        l4Days
    );
}


/* =========================================================
   VACATION VARIABLE COMPONENT
   =========================================================

   IMPORTANT:

   The fixed monthly salary is already included in
   earnings.base.

   Therefore vacation does NOT add the fixed hourly
   salary again.

   Only the average variable component is added here.
   ========================================================= */

function calculateVacationPay(
    targetMonthStr,
    historyObj,
    vacationHours
) {

    if (vacationHours <= 0) {
        return 0;
    }

    const previous3 =
        getPreviousMonths(
            targetMonthStr,
            3,
            historyObj
        );

    if (previous3.length === 0) {
        return 0;
    }

    let totalVariableGrosz = 0;

    let totalActualWorkedHours = 0;

    previous3.forEach(month => {

        totalVariableGrosz +=
            Number(
                month.vacationVariableGrossGrosz
            ) || 0;

        totalActualWorkedHours +=
            Number(
                month.actualWorkedHours
            ) || 0;
    });

    if (totalActualWorkedHours <= 0) {
        return 0;
    }

    /*
       Average variable rate per actual worked hour.
    */

    const variableHourlyRateGrosz =
        totalVariableGrosz /
        totalActualWorkedHours;

    /*
       Vacation hours × variable hourly rate.
    */

    return Math.round(
        vacationHours *
        variableHourlyRateGrosz
    );
}


/* =========================================================
   BLOOD DONATION VARIABLE COMPONENT
   =========================================================

   Fixed salary remains in base.

   Therefore only the variable component is added.
   ========================================================= */

function calculateBloodDonationPay(
    currentVariableTotalGrosz,
    currentWorkedHours,
    bloodHours
) {

    if (bloodHours <= 0) {
        return 0;
    }

    if (currentWorkedHours <= 0) {
        return 0;
    }

    const hourlyVariableRateGrosz =
        currentVariableTotalGrosz /
        currentWorkedHours;

    return Math.round(
        bloodHours *
        hourlyVariableRateGrosz
    );
}
