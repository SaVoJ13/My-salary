<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор Fiege</title>
    <style>
        /* ==========================================
           БЛОК 1: ДИЗАЙН ТА СТИЛІ (CSS)
           ========================================== */
        :root {
            --primary: #e3000f; 
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e5ec;
            --success: #27ae60;
            --premium-bg: #fff9e6;
            --premium-border: #f1c40f;
        }

        [data-theme="dark"] {
            --primary: #ff4d57;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --success: #2ecc71;
            --premium-bg: #2a2411;
            --premium-border: #d4ac0d;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; 
            box-sizing: border-box; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; transition: background 0.3s, color 0.3s;
        }

        .calculator { 
            width: 100%; max-width: 420px; background: var(--panel-bg); padding: 24px 20px; 
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
            box-sizing: border-box; position: relative; transition: background 0.3s;
        }

        .menu-btn, .close-menu { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-main); padding: 0; }
        
        .side-menu {
            position: absolute; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--panel-bg); box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            border-radius: 16px 0 0 16px; z-index: 10; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; transition: transform 0.3s ease;
            transform: translateX(-100%); overflow-y: auto;
        }
        .side-menu.open { transform: translateX(0); }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .menu-item { margin-bottom: 15px; }
        .menu-item label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; width: 100%; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; }
        h2 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .premium-badge { background: var(--premium-border); color: #000; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: none; }

        .schedule-badge {
            background: var(--premium-bg); border: 1px solid var(--premium-border);
            border-radius: 8px; padding: 4px 6px; display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            min-width: 45px;
        }
        .is-logged-in .schedule-badge { display: flex; }
        .schedule-badge span { font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .schedule-badge input {
            width: 100%; padding: 0; background: transparent; border: none;
            font-size: 15px; font-weight: 800; color: var(--primary); text-align: center; box-shadow: none;
        }
        .schedule-badge input:focus { box-shadow: none; outline: none; }

        .form-group { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        
        .premium-field { display: none; }
        .is-logged-in .premium-field { display: flex; }
        .is-logged-in .premium-badge { display: inline-block; }
        
        .sub-group { margin-top: -6px; margin-bottom: 14px; padding-left: 15px; border-left: 2px solid var(--premium-border); }
        label { font-size: 14px; font-weight: 500; color: var(--text-main); width: 60%; }
        .sub-group label { font-size: 13px; font-weight: 600; color: var(--primary); }

        input, select { 
            width: 38%; padding: 10px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 14px; text-align: center; 
            background: var(--bg-color); color: var(--text-main);
            font-weight: 600; box-sizing: border-box; appearance: none;
        }
        
        select {
            text-align-last: center; padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237f8c8d%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.1); }
        input::placeholder { color: var(--text-muted); font-weight: 400; }

        .divider { border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        .results-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .result-box { border-radius: 12px; padding: 16px 12px; text-align: center; }
        .result-box.brutto { background: var(--bg-color); border: 1px solid var(--border-color); }
        .result-box.netto { background: rgba(39, 174, 96, 0.08); border: 1px solid var(--success); }
        .result-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; }
        .result-value { font-size: 20px; font-weight: 800; }
        .brutto .result-value { color: var(--text-main); }
        .netto .result-value { color: var(--success); }

        .hidden { display: none !important; }
        .action-btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sync { background: var(--success); }
        .btn-auth-action { background: var(--primary); }
        .btn-logout { background: var(--text-muted); }
        .cloud-section { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); }
    </style>
</head>
<body id="app-body">

<div class="calculator">
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span id="menuTitle" style="font-size: 15px; font-weight: bold;">Меню</span>
            <button class="close-menu" onclick="toggleMenu()">✕</button>
        </div>

        <div class="menu-item">
            <label id="lblMenuLang">Мова</label>
            <select id="langSelect" style="width: 100%;" onchange="setLang(this.value)">
                <option value="ua">Українська</option>
                <option value="pl">Polski</option>
            </select>
        </div>
        <div class="menu-item">
            <label id="lblMenuTheme">Тема</label>
            <select id="themeSelect" style="width: 100%;" onchange="setTheme(this.value)">
                <option value="light" id="optThemeLight">Світла</option>
                <option value="dark" id="optThemeDark">Темна</option>
            </select>
        </div>

        <div class="divider" style="margin: 10px 0;"></div>

        <div class="cloud-section">
            <label style="width: 100%; font-weight: bold; margin-bottom: 8px; display: block;" id="lblCloudHeader">Акаунт & Хмара</label>
            <div id="auth-container">
                <input type="email" id="email" placeholder="Email" style="width: 100%; margin-bottom: 6px; text-align: left;">
                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 8px; text-align: left;">
                <button id="btn-login" class="action-btn btn-auth-action">Увійти (PRO)</button>
                <button id="btn-register" class="action-btn" style="background: var(--text-main); margin-top: 4px;">Реєстрація</button>
            </div>
            <div id="sync-container" class="hidden">
                <span id="user-email-display" style="font-size: 11px; display: block; margin-bottom: 8px; word-break: break-all; font-weight: bold;"></span>
                <button id="btn-sync-up" class="action-btn btn-sync">Зберегти місяць ☁️</button>
                <button id="btn-sync-down" class="action-btn" style="background: #2980b9; margin-top: 4px;">Завантажити місяць 📥</button>
                <button id="btn-logout" class="action-btn btn-logout" style="margin-top: 8px;">Вийти (Гостьовий режим)</button>
            </div>
        </div>
    </div>

    <div class="header-row">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="lblTitle" style="margin-right: auto; margin-left: 15px;">Калькулятор ЗП <span class="premium-badge">PRO</span></h2>
        
        <div class="schedule-badge" id="scheduleBadgeContainer">
            <span id="lblScheduleDays">Графік</span>
            <input type="number" id="scheduleDays" placeholder="0" min="0">
        </div>
    </div>
    
    <div class="form-group">
        <label id="lblMonth">Місяць</label>
        <select id="monthSelect"></select>
    </div>

    <div class="form-group">
        <label id="lblBase">Загальна ставка (zł)</label>
        <input type="number" id="baseSalary" value="5750" min="0">
    </div>

    <div class="form-group">
        <label id="lblBonus">Премія</label>
        <select id="bonusPctSelect">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="12.5">12.5%</option>
            <option value="15" selected>15%</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblMorning">Ранкові зміни (шт)</label>
        <input type="number" id="morningShifts" placeholder="-" min="0">
    </div>
    <div class="form-group">
        <label id="lblAfternoon">Денні зміни (шт)</label>
        <input type="number" id="afternoonShifts" placeholder="-" min="0">
    </div>
    <div class="form-group">
        <label id="lblNight">Нічні зміни (шт)</label>
        <input type="number" id="nightShifts" placeholder="-" min="0">
    </div>

    <div class="form-group">
        <label id="lblWeekend">Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" placeholder="-" min="0">
    </div>

    <div class="form-group">
        <label id="lblOvertime">Надгодини (днів)</label>
        <input type="number" id="overtimeDays" placeholder="-" min="0" step="0.5">
    </div>

    <div class="form-group premium-field">
        <label id="lblVacationDays">Відпустка (днів)</label>
        <input type="number" id="vacationDays" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="urlopBonusGroup">
        <label id="lblUrlopBonus">Сума відпустки (zł) ℹ️</label>
        <input type="number" id="urlopBonus" placeholder="0.00" min="0" style="color:var(--primary);">
    </div>

    <div class="form-group premium-field">
        <label id="lblBloodDonation">Донація крові (днів)</label>
        <input type="number" id="bloodDonationDays" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="bloodBonusGroup">
        <label id="lblBloodBonus">Сума донації (zł) ℹ️</label>
        <input type="number" id="bloodBonus" placeholder="0.00" min="0" style="color:var(--primary);">
    </div>

    <div class="form-group premium-field">
        <label id="lblL4Days">Лікарняний L4 (календарні)</label>
        <input type="number" id="l4Days" placeholder="0" min="0">
    </div>
    <div class="form-group sub-group premium-field hidden" id="l4MissedGroup">
        <label id="lblL4Missed">Пропущено змін (шт) ℹ️️</label>
        <input type="number" id="l4MissedShifts" placeholder="0" min="0" style="color:var(--primary);">
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label id="lblUnder26">Вік до 26 років</label>
        <select id="under26Select">
            <option value="no" id="optU26No" selected>Ні</option>
            <option value="yes" id="optU26Yes">Так</option>
        </select>
    </div>
    <div class="form-group">
        <label id="lblPPK">Участь у PPK</label>
        <select id="ppkSelect">
            <option value="no" id="optPpkNo" selected>Ні</option>
            <option value="yes" id="optPpkYes">Так</option>
        </select>
    </div>
    <div class="form-group">
        <label id="lblInsurance">Додаткове страхування</label>
        <select id="insuranceSelect">
            <option value="yes" id="optInsYes" selected>Так</option>
            <option value="no" id="optInsNo">Ні</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box brutto">
            <div class="result-title">BRUTTO</div>
            <div class="result-value" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box netto">
            <div class="result-title">NETTO</div>
            <div class="result-value" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const TAX_RULES = {
        2026: {
            zusRate: 0.1371,
            nfzRate: 0.09,
            pitRate: 0.12,
            kwotaWolna: 300.00,
            benefitZusNfz: 30.25,
            benefitTax: 54.00
        }
    };

    const COMPANY_CONFIG = {
        fiege: {
            nightBaseSalary: 4806.00,
            nightBonusPercent: 0.20,
            weekendBonus: 100.00,
            overtimeMultiplier: 2.0,
            laundryMax: 16.00,
            ppkRate: 0.02,
            extraInsurance: 36.70
        }
    };

    const stateWorkDays = [20, 20, 22, 21, 20, 21, 23, 20, 22, 22, 20, 20];
    const dict = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)", 
            schedDays: "Графік", vacationDays: "Відпустка (днів)", urlopBonus: "Сума відпустки (zł) ℹ️", 
            bloodDonation: "Донація крові (днів)", bloodBonus: "Сума донації (zł) ℹ️", 
            l4Days: "Лікарняний L4 (календарні)", bonus: "Премія", morning: "Ранкові зміни (шт)", 
            afternoon: "Денні зміни (шт)", night: "Нічні зміни (шт)", weekend: "Робочі сб / нд (днів)", 
            overtime: "Надгодини (днів)", under26: "Вік до 26 років", ppk: "Участь у PPK", 
            insurance: "Дод. страхування", yes: "Так", no: "Ні", menuTitle: "Меню", menuLang: "Мова", menuTheme: "Тема", 
            monthNames: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka (zł)", 
            schedDays: "Grafik", vacationDays: "Urlop (dni)", urlopBonus: "Kwota urlopu (zł) ℹ️", 
            bloodDonation: "Oddanie krwi (dni)", bloodBonus: "Kwota za krew (zł) ℹ️", 
            l4Days: "L4 (dni kalendarzowe)", bonus: "Premia", morning: "Poranne zmiany (szt)", 
            afternoon: "Dzienne zmiany (szt)", night: "Nocne zmiany (szt)", weekend: "Weekendy (dni)", 
            overtime: "Nadgodziny (dni)", under26: "Wiek < 26 lat", ppk: "PPK", 
            insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie", menuTitle: "Menu", menuLang: "Język", menuTheme: "Motyw",
            monthNames: ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"]
        }
    };

    function calculateSalaryEngine(inputData, taxRules, companyRules) {
        let regWorkedDays = inputData.morningShifts + inputData.afternoonShifts + inputData.nightShifts;
        if (inputData.isShiftsEmpty) {
            regWorkedDays = Math.max(0, inputData.scheduleDays - inputData.vacationDays - inputData.bloodDonationDays - inputData.l4MissedShifts);
        }
        
        const overtimeDays = Math.min(inputData.overtimeDays, regWorkedDays); 
        const scheduleDays = inputData.scheduleDays;
        const stateDays = inputData.stateDays;

        let adjustedBase = inputData.baseSalary;
        let l4Pay = 0;
        
        if (inputData.l4Days > 0) {
            adjustedBase = inputData.baseSalary - ((inputData.baseSalary / 30) * inputData.l4Days);
            const fallbackL4Rate = (inputData.baseSalary * (1 - taxRules.zusRate)) / 30;
            const l4DailyRate = inputData.cachedL4DailyRate > 0 ? inputData.cachedL4DailyRate : fallbackL4Rate;
            l4Pay = l4DailyRate * 0.80 * inputData.l4Days;
        }

        const bonusAmount = scheduleDays > 0 
            ? ((inputData.baseSalary * (inputData.bonusPct / 100)) / scheduleDays * regWorkedDays) 
            : (inputData.baseSalary * (inputData.bonusPct / 100));

        const nightTariff = Math.round(((companyRules.nightBaseSalary / (stateDays * 8)) * companyRules.nightBonusPercent) * 100) / 100;
        const overtimeTariff = Math.round(((inputData.baseSalary / stateDays) * companyRules.overtimeMultiplier) * 100) / 100;

        const totalNightPay = Math.round((inputData.morningShifts * (10/60) * nightTariff) * 100) / 100 
                            + (inputData.nightShifts * 8 * nightTariff) 
                            + (inputData.nightShifts * 30);
                            
        const totalWeekendPay = inputData.weekendDays * companyRules.weekendBonus;
        const totalOvertimePay = overtimeDays * overtimeTariff;

        const totalUrlopPay = inputData.vacationDays > 0 ? inputData.totalUrlopPay : 0;
        const bloodDonationPay = inputData.bloodDonationDays > 0 ? inputData.totalBloodPay : 0;

        const gross = adjustedBase + l4Pay + bonusAmount + totalNightPay + totalWeekendPay + totalOvertimePay + totalUrlopPay + bloodDonationPay;

        const zusBase = gross - l4Pay;
        const zus = zusBase * taxRules.zusRate;
        const healthBase = gross - zus;
        const nfz = Math.round((healthBase * taxRules.nfzRate) * 100) / 100;
        
        let pit = 0;
        if (!inputData.under26) {
            const pitBase = Math.round(Math.max(0, healthBase - taxRules.kwotaWolna));
            pit = Math.max(0, Math.round((pitBase * taxRules.pitRate) - taxRules.kwotaWolna));
        }

        const totalBenefitCost = taxRules.benefitZusNfz + taxRules.benefitTax;
        const laundryAllowance = scheduleDays > 0 
            ? Math.min(companyRules.laundryMax, (regWorkedDays / scheduleDays) * companyRules.laundryMax) 
            : 0;
        
        const ppkCost = inputData.ppkActive ? gross * companyRules.ppkRate : 0;
        const insuranceCost = inputData.insuranceActive ? companyRules.extraInsurance : 0;

        const net = gross - zus - nfz - pit - ppkCost - insuranceCost - totalBenefitCost + laundryAllowance;

        return {
            totals: { gross, net },
            taxes: { zus, nfz, pit },
            metadata: { 
                autoDailyBloodRate: scheduleDays > 0 ? ((bonusAmount + totalNightPay + totalWeekendPay + totalOvertimePay) / scheduleDays) : (inputData.baseSalary / stateDays) 
            }
        };
    }

    const firebaseConfig = {
        apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
        authDomain: "my-salary-9ea25.firebaseapp.com",
        projectId: "my-salary-9ea25",
        storageBucket: "my-salary-9ea25.firebasestorage.app",
        messagingSenderId: "412323283290",
        appId: "1:412323283290:web:b4706af670a57776333363"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentLang = 'ua';
    let isPremium = false;
    window.cachedL4DailyRate = null;

    onAuthStateChanged(auth, async (user) => {
        isPremium = !!user;
        document.getElementById('app-body').classList.toggle('is-logged-in', isPremium);
        document.getElementById('auth-container').classList.toggle('hidden', isPremium);
        document.getElementById('sync-container').classList.toggle('hidden', !isPremium);
        
        if(user) {
            document.getElementById('user-email-display').innerText = "👤 " + user.email;
            await loadCloudData(); 
        } else {
            clearInputs();
        }
        calculateSalaryAdapter();
    });

    document.getElementById('btn-login').addEventListener('click', async () => { 
        try { 
            await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
        } catch (e) { alert("Помилка входу: " + e.message); } 
    });
    
    document.getElementById('btn-register').addEventListener('click', async () => { 
        try { 
            await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
            alert("Реєстрація успішна!"); 
        } catch (e) { alert("Помилка: " + e.message); } 
    });
    
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    document.getElementById('btn-sync-up').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) { alert("Оберіть місяць!"); return; }

        const btn = document.getElementById('btn-sync-up');
        const originalText = btn.innerText;
        btn.innerText = "Збереження... ☁️"; 

        const data = { updatedAt: new Date().toISOString() };
        document.querySelectorAll('input, select').forEach(el => {
            if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id)) data[el.id] = el.value;
        });

        try {
            await setDoc(doc(db, "users", auth.currentUser.uid, "months", monthVal), data, { merge: true });
            alert("Дані збережені у хмару! ☁️");
            await updateL4Cache(monthVal);
        } catch (error) { alert("Помилка збереження: " + error.message); } 
        finally { btn.innerText = originalText; }
    });

    async function loadCloudData() {
        if (!auth.currentUser) return;
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) return;

        try {
            const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", monthVal));
            if (snap.exists()) {
                const d = snap.data();
                document.querySelectorAll('input, select').forEach(el => {
                    if(!['langSelect', 'themeSelect', 'email', 'password'].includes(el.id) && d[el.id] !== undefined) el.value = d[el.id];
                });
            } else { clearInputs(); }
            await updateL4Cache(monthVal);
            calculateSalaryAdapter();
        } catch(e) { console.error("Помилка завантаження", e); }
    }

    document.getElementById('btn-sync-down').addEventListener('click', async () => { await loadCloudData(); alert("Дані завантажені з хмари! 📥"); });

    function clearInputs() {
        document.querySelectorAll('input[type=number]').forEach(el => el.value = '');
        document.getElementById('bonusPctSelect').value = "15";
        document.getElementById('baseSalary').value = "";
    }

    window.toggleMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }
    window.setTheme = function(theme) { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : ''); localStorage.setItem('theme', theme); }
    
    window.setLang = function(lang) {
        currentLang = lang; const d = dict[lang];
        document.getElementById('lblTitle').innerHTML = d.title + ' <span class="premium-badge">PRO</span>';
        document.getElementById('lblMonth').innerText = d.month; document.getElementById('lblBase').innerText = d.base;
        document.getElementById('lblScheduleDays').innerText = d.schedDays;
        document.getElementById('lblVacationDays').innerText = d.vacationDays; document.getElementById('lblUrlopBonus').innerText = d.urlopBonus;
        document.getElementById('lblBloodDonation').innerText = d.bloodDonation; document.getElementById('lblBloodBonus').innerText = d.bloodBonus;
        document.getElementById('lblL4Days').innerText = d.l4Days; 
        document.getElementById('lblBonus').innerText = d.bonus; document.getElementById('lblMorning').innerText = d.morning;
        document.getElementById('lblAfternoon').innerText = d.afternoon; document.getElementById('lblNight').innerText = d.night; 
        document.getElementById('lblWeekend').innerText = d.weekend; document.getElementById('lblOvertime').innerText = d.overtime; 
        document.getElementById('lblUnder26').innerText = d.under26; document.getElementById('lblPPK').innerText = d.ppk; 
        document.getElementById('lblInsurance').innerText = d.insurance; document.getElementById('menuTitle').innerText = d.menuTitle; 
        document.getElementById('lblMenuLang').innerText = d.menuLang; document.getElementById('lblMenuTheme').innerText = d.menuTheme; 
        document.getElementById('optU26Yes').innerText = d.yes; document.getElementById('optU26No').innerText = d.no; 
        document.getElementById('optPpkYes').innerText = d.yes; document.getElementById('optPpkNo').innerText = d.no; 
        document.getElementById('optInsYes').innerText = d.yes; document.getElementById('optInsNo').innerText = d.no;
        initMonths(); calculateSalaryAdapter();
    }

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '';
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); 
        const dNames = dict[currentLang].monthNames;
        
        for(let i = 1; i >= -11; i--) {
            let d = new Date(currentYear, currentMonth + i, 1);
            let y = d.getFullYear();
            let m = d.getMonth();
            let val = y + "-" + String(m + 1).padStart(2, '0');
            let opt = document.createElement('option');
            opt.value = val; opt.text = dNames[m] + " " + y;
            select.appendChild(opt);
        }
        if(!currentVal) select.value = currentYear + "-" + String(currentMonth + 1).padStart(2, '0');
        else select.value = currentVal;
    }

    async function updateL4Cache(currentMonthVal) {
        if (!auth.currentUser) { window.cachedL4DailyRate = null; return; }
        const [yStr, mStr] = currentMonthVal.split('-');
        let cYear = parseInt(yStr); let cMonth = parseInt(mStr);
        let totalNetBase = 0; let monthsFound = 0;
        
        for (let i = 1; i <= 12; i++) {
            let pMonth = cMonth - i; let pYear = cYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastStr = pYear + "-" + String(pMonth).padStart(2, '0');
            try {
                const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastStr));
                if (snap.exists()) {
                    const data = snap.data();
                    const pBase = Math.max(0, parseFloat(data.baseSalary) || 5750);
                    let pPct = parseFloat(data.bonusPctSelect); if (isNaN(pPct)) pPct = 15;
                    const mS = Math.max(0, parseInt(data.morningShifts) || 0); const aS = Math.max(0, parseInt(data.afternoonShifts) || 0);
                    const nS = Math.max(0, parseInt(data.nightShifts) || 0); const over = Math.max(0, parseFloat(data.overtimeDays) || 0);
                    const wknd = Math.max(0, parseInt(data.weekendDays) || 0); const vac = Math.max(0, parseInt(data.vacationDays) || 0);
                    const blood = Math.max(0, parseInt(data.bloodDonationDays) || 0); const l4m = Math.max(0, parseInt(data.l4MissedShifts) || 0);
                    
                    let regWorked = mS + aS + nS; const pSched = parseInt(data.scheduleDays) || 21;
                    if (!data.morningShifts && !data.afternoonShifts && !data.nightShifts) regWorked = Math.max(0, pSched - vac - blood - l4m);
                    
                    const bonusAm = pSched > 0 ? (pBase * (pPct / 100)) / pSched * regWorked : 0;
                    const nTariff = ((COMPANY_CONFIG.fiege.nightBaseSalary / (21 * 8)) * COMPANY_CONFIG.fiege.nightBonusPercent); 
                    const nightAm = (mS * (10/60) * nTariff) + (nS * 8 * nTariff) + (nS * 30);
                    const wkndAm = wknd * 100; const overAm = over * ((pBase / 21) * 2);
                    
                    let grossBase = pBase + bonusAm + nightAm + wkndAm + overAm;
                    let netZus = grossBase * (1 - TAX_RULES[2026].zusRate); 
                    totalNetBase += netZus; monthsFound++;
                }
            } catch(e) {}
        }
        window.cachedL4DailyRate = monthsFound > 0 ? (totalNetBase / monthsFound) / 30 : null;
    }

    async function getAutoHourlyUrlopRate(currentYear, monthIdx) {
        if (!auth.currentUser) return 0;
        let totalExtras = 0; let totalWorkedHours = 0;
        
        for (let i = 1; i <= 3; i++) {
            let pMonth = monthIdx + 1 - i; let pYear = currentYear;
            if (pMonth <= 0) { pMonth += 12; pYear -= 1; }
            const pastMonthStr = pYear + "-" + String(pMonth).padStart(2, '0');
            const stDays = stateWorkDays[pMonth - 1] || 21;
            
            try {
                const docSnap = await getDoc(doc(db, "users", auth.currentUser.uid, "months", pastMonthStr));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const pastBase = Math.max(0, parseFloat(data.baseSalary) || 5750);
                    let pastPct = parseFloat(data.bonusPctSelect); if (isNaN(pastPct)) pastPct = 15;
                    const mS = Math.max(0, parseInt(data.morningShifts) || 0); 
                    const aS = Math.max(0, parseInt(data.afternoonShifts) || 0);
                    const nS = Math.max(0, parseInt(data.nightShifts) || 0); 
                    const wknd = Math.max(0, parseInt(data.weekendDays) || 0);
                    const rawOver = Math.max(0, parseFloat(data.overtimeDays) || 0);
                    
                    let regWorkedDays = mS + aS + nS; const pastSched = parseInt(data.scheduleDays) || stDays;
                    const l4m = Math.max(0, parseInt(data.l4MissedShifts) || 0); const vac = Math.max(0, parseInt(data.vacationDays) || 0);
                    const blood = Math.max(0, parseInt(data.bloodDonationDays) || 0);
                    
                    if (!data.morningShifts && !data.afternoonShifts && !data.nightShifts) {
                        regWorkedDays = Math.max(0, pastSched - vac - blood - l4m);
                    }
                    const over = Math.min(rawOver, regWorkedDays); 
                    let pActualDays = regWorkedDays + over;
                    
                    const pastBonusVal = pastSched > 0 ? (pastBase * (pastPct / 100)) / pastSched * regWorkedDays : 0;
                    const nTariff = ((COMPANY_CONFIG.fiege.nightBaseSalary / (stDays * 8)) * COMPANY_CONFIG.fiege.nightBonusPercent);
                    const pastNight = (mS * (10/60) * nTariff) + (nS * 8 * nTariff) + (nS * 30);
                    const pastWknd = wknd * 100; const pastOver = over * ((pastBase / stDays) * 1.5);

                    totalExtras += (pastBonusVal + pastNight + pastWknd + pastOver);
                    totalWorkedHours += (pActualDays * 8);
                }
            } catch (e) {}
        }
        if (totalWorkedHours === 0) return 0;
        return (totalExtras / totalWorkedHours);
    }

    // ПОДІЯ: Зміна днів відпустки
    document.getElementById('vacationDays').addEventListener('input', async function() {
        const vacDays = Math.max(0, parseInt(this.value) || 0);
        const urlopInput = document.getElementById('urlopBonus');
        if (vacDays === 0 || this.value === '') { 
            urlopInput.value = ""; 
        } else if (isPremium) {
            const monthVal = document.getElementById('monthSelect').value;
            if (monthVal) {
                const [year, month] = monthVal.split('-');
                const autoHourly = await getAutoHourlyUrlopRate(parseInt(year), parseInt(month) - 1);
                if (autoHourly > 0) {
                    const totalVacationSum = autoHourly * (vacDays * 8);
                    urlopInput.value = totalVacationSum.toFixed(2);
                }
            }
        }
        calculateSalaryAdapter();
    });

    // ПОДІЯ: Зміна днів донації крові
    document.getElementById('bloodDonationDays').addEventListener('input', function() {
        const bloodDays = Math.max(0, parseInt(this.value) || 0);
        const bloodInput = document.getElementById('bloodBonus');
        if (bloodDays === 0 || this.value === '') { 
            bloodInput.value = ""; 
        } else {
            const scheduleDays = parseInt(document.getElementById('scheduleDays').value) || 21;
            const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 5750;
            const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 15;
            const mS = parseInt(document.getElementById('morningShifts').value) || 0;
            const aS = parseInt(document.getElementById('afternoonShifts').value) || 0;
            const nS = parseInt(document.getElementById('nightShifts').value) || 0;
            const wknd = parseInt(document.getElementById('weekendDays').value) || 0;
            const rawOver = parseFloat(document.getElementById('overtimeDays').value) || 0;

            const mStr = document.getElementById('morningShifts').value;
            const aStr = document.getElementById('afternoonShifts').value;
            const nStr = document.getElementById('nightShifts').value;

            let regWorkedDays = mS + aS + nS;
            if (mStr === '' && aStr === '' && nStr === '') {
                regWorkedDays = Math.max(0, scheduleDays - bloodDays - (parseInt(document.getElementById('vacationDays').value) || 0));
            }
            const overtimeDays = Math.min(rawOver, regWorkedDays);
            const bonusAmount = scheduleDays > 0 ? ((baseSalary * (bonusPct / 100)) / scheduleDays * regWorkedDays) : 0;
            const monthIdx = parseInt(document.getElementById('monthSelect').value.split('-')[1]) - 1;
            const stateDays = stateWorkDays[monthIdx >= 0 ? monthIdx : 0];
            const nightTariff = (COMPANY_CONFIG.fiege.nightBaseSalary / (stateDays * 8)) * COMPANY_CONFIG.fiege.nightBonusPercent;
            const totalNightPay = (mS * (10/60) * nightTariff) + (nS * 8 * nightTariff) + (nS * 30);
            const totalWeekendPay = wknd * COMPANY_CONFIG.fiege.weekendBonus;
            const overtimeTariff = (baseSalary / stateDays) * COMPANY_CONFIG.fiege.overtimeMultiplier;
            const totalOvertimePay = overtimeDays * overtimeTariff;

            const currentVariables = bonusAmount + totalNightPay + totalWeekendPay + totalOvertimePay;
            const autoDailyBloodRate = scheduleDays > 0 ? (currentVariables / scheduleDays) : (baseSalary / stateDays);
            
            const totalBloodSum = autoDailyBloodRate * bloodDays;
            bloodInput.value = totalBloodSum.toFixed(2);
        }
        calculateSalaryAdapter();
    });

    // РЕАКТИВНІСТЬ ГРАФІКА: Автоматичний підрахунок днів графіку при вводі змін та відсутностей
    ['morningShifts', 'afternoonShifts', 'nightShifts', 'vacationDays', 'bloodDonationDays', 'l4MissedShifts'].forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            el.addEventListener('input', () => {
                if(isPremium) {
                    const m = Math.max(0, parseInt(document.getElementById('morningShifts').value) || 0);
                    const a = Math.max(0, parseInt(document.getElementById('afternoonShifts').value) || 0);
                    const n = Math.max(0, parseInt(document.getElementById('nightShifts').value) || 0);
                    const vac = Math.max(0, parseInt(document.getElementById('vacationDays').value) || 0);
                    const blood = Math.max(0, parseInt(document.getElementById('bloodDonationDays').value) || 0);
                    const l4m = Math.max(0, parseInt(document.getElementById('l4MissedShifts').value) || 0);
                    
                    const mStr = document.getElementById('morningShifts').value;
                    const aStr = document.getElementById('afternoonShifts').value;
                    const nStr = document.getElementById('nightShifts').value;
                    const vStr = document.getElementById('vacationDays').value;
                    const bStr = document.getElementById('bloodDonationDays').value;
                    const lStr = document.getElementById('l4MissedShifts').value;

                    if (mStr !== '' || aStr !== '' || nStr !== '' || vStr !== '' || bStr !== '' || lStr !== '') {
                        let autoSched = m + a + n + vac + blood + l4m;
                        document.getElementById('scheduleDays').value = autoSched > 0 ? autoSched : "";
                    } else {
                        document.getElementById('scheduleDays').value = "";
                    }
                }
                calculateSalaryAdapter();
            });
        }
    });

    window.calculateSalaryAdapter = function() {
        const monthVal = document.getElementById('monthSelect').value;
        if (!monthVal) { document.getElementById('grossResult').innerText = '0.00 zł'; document.getElementById('netResult').innerText = '0.00 zł'; return; }
        
        const monthIdx = parseInt(monthVal.split('-')[1]) - 1;
        const stateDays = stateWorkDays[monthIdx];
        
        const autoBase = monthIdx >= 9 ? 5950 : 5750;
        let baseInput = document.getElementById('baseSalary');
        if (!baseInput.value) baseInput.value = autoBase;
        
        const mStr = document.getElementById('morningShifts').value;
        const aStr = document.getElementById('afternoonShifts').value;
        const nStr = document.getElementById('nightShifts').value;
        
        const totalUrlopPay = Math.max(0, parseFloat(document.getElementById('urlopBonus').value) || 0);
        const totalBloodPay = Math.max(0, parseFloat(document.getElementById('bloodBonus').value) || 0);

        const inputData = {
            baseSalary: Math.max(0, parseFloat(baseInput.value)) || 0,
            bonusPct: parseFloat(document.getElementById('bonusPctSelect').value) || 0,
            stateDays: stateDays,
            scheduleDays: isPremium ? (parseInt(document.getElementById('scheduleDays').value) || stateDays) : stateDays,
            
            morningShifts: Math.max(0, parseInt(mStr) || 0),
            afternoonShifts: Math.max(0, parseInt(aStr) || 0),
            nightShifts: Math.max(0, parseInt(nStr) || 0),
            weekendDays: Math.max(0, parseInt(document.getElementById('weekendDays').value) || 0),
            overtimeDays: Math.max(0, parseFloat(document.getElementById('overtimeDays').value)) || 0,
            
            vacationDays: isPremium ? Math.max(0, parseInt(document.getElementById('vacationDays').value) || 0) : 0,
            totalUrlopPay: totalUrlopPay,
            
            bloodDonationDays: isPremium ? Math.max(0, parseInt(document.getElementById('bloodDonationDays').value) || 0) : 0,
            totalBloodPay: totalBloodPay,
            
            l4Days: isPremium ? Math.max(0, parseInt(document.getElementById('l4Days').value) || 0) : 0,
            l4MissedShifts: Math.max(0, parseInt(document.getElementById('l4MissedShifts').value) || 0),
            cachedL4DailyRate: window.cachedL4DailyRate,
            
            under26: document.getElementById('under26Select').value === 'yes',
            ppkActive: document.getElementById('ppkSelect').value === 'yes',
            insuranceActive: document.getElementById('insuranceSelect').value === 'yes',
            isShiftsEmpty: (mStr === '' && aStr === '' && nStr === '')
        };

        const result = calculateSalaryEngine(inputData, TAX_RULES[2026], COMPANY_CONFIG.fiege);

        document.getElementById('urlopBonusGroup').classList.toggle('hidden', inputData.vacationDays === 0);
        document.getElementById('bloodBonusGroup').classList.toggle('hidden', inputData.bloodDonationDays === 0);
        document.getElementById('l4MissedGroup').classList.toggle('hidden', inputData.l4Days === 0);

        document.getElementById('grossResult').innerText = result.totals.gross.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = result.totals.net.toFixed(2) + ' zł';
    }

    // UX: виділення тексту замість стирання значень при фокусі
    document.querySelectorAll('input[type=number]').forEach(el => {
        el.addEventListener('focus', function() { this.select(); });
    });

    document.querySelectorAll('input, select').forEach(el => {
        if(!['langSelect', 'themeSelect', 'email', 'password', 'vacationDays', 'bloodDonationDays', 'l4Days', 'l4MissedShifts', 'monthSelect', 'scheduleDays', 'morningShifts', 'afternoonShifts', 'nightShifts'].includes(el.id)) {
            el.addEventListener('input', window.calculateSalaryAdapter); 
            el.addEventListener('change', window.calculateSalaryAdapter);
        }
    });
    
    document.getElementById('scheduleDays').addEventListener('input', window.calculateSalaryAdapter);
    document.getElementById('monthSelect').addEventListener('change', async () => { await loadCloudData(); });
    setTheme(localStorage.getItem('theme') || 'light');
    window.setLang('ua');
</script>
