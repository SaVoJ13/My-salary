<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiege Salary Calculator</title>
    <!-- Підключаємо бібліотеки Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ваші персональні ключі Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
            authDomain: "my-salary-9ea25.firebaseapp.com",
            projectId: "my-salary-9ea25",
            storageBucket: "my-salary-9ea25.firebasestorage.app",
            messagingSenderId: "412323283290",
            appId: "1:412323283290:web:b4706af670a57776333363",
            measurementId: "G-9K2FQVSPE1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Робимо доступними глобально для інтерфейсу
        window.auth = auth;
        window.db = db;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
    </script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #e3000f; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; background: #e3000f; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b5000b; }
        .hidden { display: none !important; }
        .user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f8d7da; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Екран авторизації (Логін / Реєстрація) -->
        <div id="auth-screen">
            <h2>Fiege Login</h2>
            <div class="input-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="введіть email">
            </div>
            <div class="input-group">
                <label>Пароль:</label>
                <input type="password" id="password" placeholder="введіть пароль">
            </div>
            <button onclick="handleLogin()">Увійти</button>
            <button onclick="handleRegister()" style="background: #2c3e50; margin-top: 5px;">Зареєструватися</button>
        </div>

        <!-- Головний екран калькулятора (поки прихований до входу) -->
        <div id="app-screen" class="hidden">
            <div class="user-info">
                <span id="user-email-display"></span>
                <button onclick="handleLogout()" style="width: auto; padding: 5px 10px; margin: 0; background: #6c757d;">Вийти</button>
            </div>
            <h2>Калькулятор Зарплати</h2>
            <p style="text-align: center; color: green;">База Firebase успішно підключена! 🎉</p>
            <!-- Сюди пізніше повернемо основний інтерфейс калькулятора -->
        </div>
    </div>

    <script>
        // Слідкуємо за станом користувача (авторизований чи ні)
        setTimeout(() => {
            window.onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    document.getElementById('user-email-display').innerText = user.email;
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('hidden');
                }
            });
        }, 1000);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
            } catch (error) {
                alert("Помилка входу: " + error.message);
            }
        }

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await window.createUserWithEmailAndPassword(window.auth, email, password);
                alert("Реєстрація успішна!");
            } catch (error) {
                alert("Помилка реєстрації: " + error.message);
            }
        }

        async function handleLogout() {
            await window.signOut(window.auth);
        }
    </script>

</body>
</html>
