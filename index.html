<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор Fiege</title>
    <style>
        :root {
            --primary: #e3000f; 
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e5ec;
            --success: #27ae60;
        }

        [data-theme="dark"] {
            --primary: #ff4d57;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --success: #2ecc71;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .calculator { 
            width: 100%;
            max-width: 420px; 
            background: var(--panel-bg); 
            padding: 24px 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
            box-sizing: border-box;
            position: relative;
            transition: background 0.3s;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
            width: auto;
            margin: 0;
        }

        .side-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: var(--panel-bg);
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            border-radius: 16px 0 0 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            transform: translateX(-100%);
            overflow-y: auto;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .menu-item {
            margin-bottom: 15px;
        }

        .menu-item label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            width: 100%;
        }

        .close-menu {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-main);
            width: auto;
            margin: 0;
            padding: 0;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2 { 
            margin: 0; 
            font-size: 20px; 
            color: var(--text-main); 
            font-weight: 700;
        }

        .form-group { 
            margin-bottom: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        label { 
            font-size: 14px; 
            font-weight: 500; 
            color: var(--text-main);
            width: 60%;
        }

        input, select { 
            width: 38%; 
            padding: 10px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 14px; 
            text-align: center; 
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s ease;
            box-sizing: border-box;
            appearance: none;
        }

        select {
            text-align: center;
            text-align-last: center;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237f8c8d%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 8px auto;
            padding-right: 20px;
        }

        input:focus, select:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .divider { 
            border-top: 1px solid var(--border-color); 
            margin: 20px 0; 
        }
        
        .results-panel { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .result-box { 
            border-radius: 12px; 
            padding: 16px 12px; 
            text-align: center; 
        }

        .result-box.brutto {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .result-box.netto {
            background: rgba(39, 174, 96, 0.08);
            border: 1px solid var(--success);
        }

        .result-title { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }

        .result-value { 
            font-size: 20px; 
            font-weight: 800; 
        }
        
        .brutto .result-value { color: var(--text-main); }
        .netto .result-value { color: var(--success); }

        .hidden { display: none !important; }
        .action-btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sync { background: var(--success); }
        .btn-auth-action { background: var(--primary); }
        .btn-logout { background: var(--text-muted); }
        
        .cloud-section {
            background: rgba(0,0,0,0.03);
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Випадаюче бокове меню -->
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span id="menuTitle" style="font-size: 15px; font-weight: bold;">Меню</span>
            <button class="close-menu" onclick="toggleMenu()">✕</button>
        </div>

        <div class="menu-item">
            <label id="lblMenuLang">Мова</label>
            <select id="langSelect" style="width: 100%;" onchange="setLang(this.value)">
                <option value="ua">Українська</option>
                <option value="pl">Polski</option>
            </select>
        </div>

        <div class="menu-item">
            <label id="lblMenuTheme">Тема</label>
            <select id="themeSelect" style="width: 100%;" onchange="setTheme(this.value)">
                <option value="light">Світла</option>
                <option value="dark">Темна</option>
            </select>
        </div>

        <div class="divider" style="margin: 10px 0;"></div>

        <!-- Хмарна синхронізація -->
        <div class="cloud-section">
            <label style="width: 100%; font-weight: bold; margin-bottom: 8px; display: block;" id="lblCloudHeader">Хмара (Firebase)</label>
            
            <div id="auth-container">
                <input type="email" id="email" placeholder="Email" style="width: 100%; margin-bottom: 6px; text-align: left;">
                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 8px; text-align: left;">
                <button id="btn-login" class="action-btn btn-auth-action">Увійти</button>
                <button id="btn-register" class="action-btn" style="background: var(--text-main); margin-top: 4px;">Реєстрація</button>
            </div>

            <div id="sync-container" class="hidden">
                <span id="user-email-display" style="font-size: 11px; display: block; margin-bottom: 8px; word-break: break-all; font-weight: bold;"></span>
                <button id="btn-sync-up" class="action-btn btn-sync">Зберегти у хмару ☁️</button>
                <button id="btn-sync-down" class="action-btn" style="background: #2980b9; margin-top: 4px;">Завантажити з хмари 📥</button>
                <button id="btn-logout" class="action-btn btn-logout" style="margin-top: 8px;">Вийти з акаунта</button>
            </div>
        </div>
    </div>

    <!-- Головний екран калькулятора -->
    <div class="header-row">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="lblTitle" style="margin-right: auto; margin-left: 15px;">Калькулятор ЗП</h2>
    </div>
    
    <div class="form-group">
        <label id="lblMonth">Місяць</label>
        <select id="monthSelect"></select>
    </div>

    <div class="form-group">
        <label id="lblUnder26">Вік до 26 років</label>
        <select id="under26Select">
            <option value="" disabled selected>-</option>
            <option value="yes" id="optU26Yes">Так</option>
            <option value="no" id="optU26No">Ні</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblPPK">Участь у PPK</label>
        <select id="ppkSelect">
            <option value="" disabled selected>-</option>
            <option value="yes" id="optPpkYes">Так</option>
            <option value="no" id="optPpkNo">Ні</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblInsurance">Додаткове страхування</label>
        <select id="insuranceSelect">
            <option value="" disabled selected>-</option>
            <option value="yes" id="optInsYes">Так</option>
            <option value="no" id="optInsNo">Ні</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblBase">Загальна ставка (zł)</label>
        <input type="number" id="baseSalary" value="5950">
    </div>

    <div class="form-group">
        <label id="lblBonus">Премія</label>
        <select id="bonusPctSelect">
            <option value="" disabled selected>-</option>
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lblMorning">Ранкові зміни (шт)</label>
        <input type="number" id="morningShifts" placeholder="-">
    </div>

    <div class="form-group">
        <label id="lblNight">Нічні зміни (шт)</label>
        <input type="number" id="nightShifts" placeholder="-">
    </div>

    <div class="form-group">
        <label id="lblWeekend">Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" placeholder="-">
    </div>

    <div class="form-group">
        <label id="lblOvertime">Надгодини (днів)</label>
        <input type="number" id="overtimeDays" placeholder="-">
    </div>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box brutto">
            <div class="result-title">BRUTTO</div>
            <div class="result-value" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box netto">
            <div class="result-title">NETTO</div>
            <div class="result-value" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfsfF3nLzqaAJTAfp73715efQhri-SOT8",
        authDomain: "my-salary-9ea25.firebaseapp.com",
        projectId: "my-salary-9ea25",
        storageBucket: "my-salary-9ea25.firebasestorage.app",
        messagingSenderId: "412323283290",
        appId: "1:412323283290:web:b4706af670a57776333363",
        measurementId: "G-9K2FQVSPE1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const dict = {
        ua: {
            title: "Калькулятор ЗП", month: "Місяць", base: "Загальна ставка (zł)",
            bonus: "Премія", morning: "Ранкові зміни (шт)", night: "Нічні зміни (шт)",
            weekend: "Робочі сб / нд (днів)", overtime: "Надгодини (днів)", under26: "Вік до 26 років",
            ppk: "Участь у PPK", insurance: "Дод. страхування", yes: "Так", no: "Ні",
            menuLang: "Мова", menuTheme: "Тема", cloudHeader: "Хмарна синхронізація",
            months: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"]
        },
        pl: {
            title: "Kalkulator Wypłaty", month: "Miesiąc", base: "Stawka podstawowa (zł)",
            bonus: "Premia", morning: "Poranne zmiany (szt)", night: "Nocne zmiany (szt)",
            weekend: "Weekendy (dni)", overtime: "Nadgodziny (dni)", under26: "Wiek poniżej 26 lat",
            ppk: "Uczestnictwo w PPK", insurance: "Dod. ubezpieczenie", yes: "Tak", no: "Nie",
            menuLang: "Język", menuTheme: "Motyw", cloudHeader: "Synchronizacja w chmurze",
            months: ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"]
        }
    };

    let currentLang = 'ua';
    const monthWorkDays = [20, 20, 22, 21, 20, 21, 23, 20, 22, 22, 20, 20];

    window.toggleMenu = function() {
        document.getElementById('sideMenu').classList.toggle('open');
    }

    window.setTheme = function(theme) {
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        localStorage.setItem('theme', theme);
    }

    window.setLang = function(lang) {
        currentLang = lang;
        document.getElementById('lblTitle').innerText = dict[lang].title;
        document.getElementById('lblMonth').innerText = dict[lang].month;
        document.getElementById('lblBase').innerText = dict[lang].base;
        document.getElementById('lblBonus').innerText = dict[lang].bonus;
        document.getElementById('lblMorning').innerText = dict[lang].morning;
        document.getElementById('lblNight').innerText = dict[lang].night;
        document.getElementById('lblWeekend').innerText = dict[lang].weekend;
        document.getElementById('lblOvertime').innerText = dict[lang].overtime;
        document.getElementById('lblUnder26').innerText = dict[lang].under26;
        document.getElementById('lblPPK').innerText = dict[lang].ppk;
        document.getElementById('lblInsurance').innerText = dict[lang].insurance;
        document.getElementById('lblMenuLang').innerText = dict[lang].menuLang;
        document.getElementById('lblMenuTheme').innerText = dict[lang].menuTheme;
        document.getElementById('lblCloudHeader').innerText = dict[lang].cloudHeader;
        
        document.getElementById('optU26Yes').innerText = dict[lang].yes;
        document.getElementById('optU26No').innerText = dict[lang].no;
        document.getElementById('optPpkYes').innerText = dict[lang].yes;
        document.getElementById('optPpkNo').innerText = dict[lang].no;
        document.getElementById('optInsYes').innerText = dict[lang].yes;
        document.getElementById('optInsNo').innerText = dict[lang].no;

        initMonths();
        calculateSalary();
    }

    function initMonths() {
        const select = document.getElementById('monthSelect');
        const currentVal = select.value; 
        select.innerHTML = '<option value="" disabled selected>-</option>';
        dict[currentLang].months.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.text = m;
            select.appendChild(opt);
        });
        if (currentVal) {
            select.value = currentVal;
        } else {
            select.value = new Date().getMonth();
        }
    }

    function calculateSalary() {
        const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
        const monthVal = document.getElementById('monthSelect').value;
        
        if (baseSalary === 0 || monthVal === "") {
            document.getElementById('grossResult').innerText = '0.00 zł';
            document.getElementById('netResult').innerText = '0.00 zł';
            return;
        }

        const monthIdx = parseInt(monthVal);
        const workDays = monthWorkDays[monthIdx];
        const minSalary = 4806.00;
        const nightTariff = Math.round(((minSalary / (workDays * 8)) * 0.20) * 100) / 100;

        const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        const morningShifts = parseInt(document.getElementById('morningShifts').value) || 0;
        const nightShifts = parseInt(document.getElementById('nightShifts').value) || 0;
        const weekendDays = parseInt(document.getElementById('weekendDays').value) || 0;
        const overtimeDays = parseFloat(document.getElementById('overtimeDays').value) || 0;

        const isUnder26 = document.getElementById('under26Select').value === 'yes';
        const ppkActive = document.getElementById('ppkSelect').value === 'yes';
        const insuranceActive = document.getElementById('insuranceSelect').value === 'yes';

        const bonusAmount = baseSalary * (bonusPct / 100);
        const morningNightPay = Math.round((morningShifts * (10 / 60) * nightTariff) * 100) / 100;
        const nightPay = (nightShifts * 8 * nightTariff) + (nightShifts * 30);
        const totalNightPay = morningNightPay + nightPay;

        const weekendPay = weekendDays * 100;
        const overtimePay = Math.round(((baseSalary / workDays) * 2 * overtimeDays) * 100) / 100;

        const gross = baseSalary + bonusAmount + totalNightPay + weekendPay + overtimePay;

        const zus = gross * 0.1371; 
        const healthBase = gross - zus;
        const nfz = Math.round((healthBase * 0.09) * 100) / 100;
        const ppkEmployee = ppkActive ? (gross * 0.02) : 0;

        let pit = 0;
        if (!isUnder26) {
            const kup = 300.00;
            const pitBase = Math.round(Math.max(0, healthBase - kup));
            let nominalPit = (pitBase * 0.12) - 300.00;
            const benefitExpense = 54.00;
            pit = Math.round(nominalPit) + benefitExpense;
            pit = Math.max(0, pit);
        }

        const insuranceDeduction = insuranceActive ? 36.70 : 0;
        const benefitDeduction = 30.25;
        const laundryBonus = 15.00;

        const net = gross - zus - nfz - pit - ppkEmployee - insuranceDeduction - benefitDeduction + laundryBonus;

        document.getElementById('grossResult').innerText = gross.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = net.toFixed(2) + ' zł';
        
        saveLocalData();
    }

    function saveLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (month === "") return;
        const data = {
            under26: document.getElementById('under26Select').value,
            ppk: document.getElementById('ppkSelect').value,
            insurance: document.getElementById('insuranceSelect').value,
            baseSalary: document.getElementById('baseSalary').value,
            bonusPct: document.getElementById('bonusPctSelect').value,
            morningShifts: document.getElementById('morningShifts').value,
            nightShifts: document.getElementById('nightShifts').value,
            weekendDays: document.getElementById('weekendDays').value,
            overtimeDays: document.getElementById('overtimeDays').value
        };
        localStorage.setItem('salary_month_' + month, JSON.stringify(data));
    }

    function loadLocalData() {
        const month = document.getElementById('monthSelect').value;
        if (month === "") return;
        const saved = localStorage.getItem('salary_month_' + month);
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('under26Select').value = data.under26 || "";
            document.getElementById('ppkSelect').value = data.ppk || "";
            document.getElementById('insuranceSelect').value = data.insurance || "";
            document.getElementById('baseSalary').value = data.baseSalary || "5950";
            document.getElementById('bonusPctSelect').value = data.bonusPct || "";
            document.getElementById('morningShifts').value = data.morningShifts || "";
            document.getElementById('nightShifts').value = data.nightShifts || "";
            document.getElementById('weekendDays').value = data.weekendDays || "";
            document.getElementById('overtimeDays').value = data.overtimeDays || "";
        } else {
            document.getElementById('morningShifts').value = "";
            document.getElementById('nightShifts').value = "";
            document.getElementById('weekendDays').value = "";
            document.getElementById('overtimeDays').value = "";
            document.getElementById('bonusPctSelect').value = "";
        }
        calculateSalary();
    }

    document.querySelectorAll('input, select').forEach(element => {
        if(element.id !== 'langSelect' && element.id !== 'themeSelect') {
            element.addEventListener('input', calculateSalary);
            element.addEventListener('change', calculateSalary);
        }
    });

    document.getElementById('monthSelect').addEventListener('change', loadLocalData);

    const authContainer = document.getElementById('auth-container');
    const syncContainer = document.getElementById('sync-container');

    onAuthStateChanged(auth, (user) => {
        if (user) {
            authContainer.classList.add('hidden');
            syncContainer.classList.remove('hidden');
            document.getElementById('user-email-display').innerText = "👤 " + user.email;
        } else {
            authContainer.classList.remove('hidden');
            syncContainer.classList.add('hidden');
        }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        } catch (e) { alert("Помилка входу: " + e.message); }
    });

    document.getElementById('btn-register').addEventListener('click', async () => {
        try {
            await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            alert("Реєстрація успішна!");
        } catch (e) { alert("Помилка: " + e.message); }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await signOut(auth);
    });

    // Оновлена логіка: Збереження у хмару з перевірками
    document.getElementById('btn-sync-up').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        
        // Перевірка 1: Чи користувач дійсно хоче розпочати синхронізацію
        const confirmMsg = currentLang === 'ua' ? "Ви точно хочете зберегти ці дані у хмару?" : "Czy na pewno chcesz zapisać te dane w chmurze?";
        if (!confirm(confirmMsg)) return;

        const month = document.getElementById('monthSelect').value;
        const docRef = doc(db, "users", user.uid, "months", month.toString());

        try {
            // Перевірка 2: Запит до бази на наявність дублювання
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const overwriteMsg = currentLang === 'ua' 
                    ? "Увага! Дані за цей місяць вже існують у хмарі. Бажаєте їх перезаписати?" 
                    : "Uwaga! Dane za ten miesiąc już istnieją. Czy chcesz je nadpisać?";
                if (!confirm(overwriteMsg)) return; // Користувач скасував перезапис
            }

            const data = {
                under26: document.getElementById('under26Select').value,
                ppk: document.getElementById('ppkSelect').value,
                insurance: document.getElementById('insuranceSelect').value,
                baseSalary: document.getElementById('baseSalary').value,
                bonusPct: document.getElementById('bonusPctSelect').value,
                morningShifts: document.getElementById('morningShifts').value,
                nightShifts: document.getElementById('nightShifts').value,
                weekendDays: document.getElementById('weekendDays').value,
                overtimeDays: document.getElementById('overtimeDays').value,
                updatedAt: new Date()
            };
            
            await setDoc(docRef, data);
            alert(currentLang === 'ua' ? "Дані успішно збережені у хмару! ☁️" : "Dane pomyślnie zapisane w chmurze! ☁️");
        } catch (e) { 
            alert((currentLang === 'ua' ? "Помилка хмари: " : "Błąd chmury: ") + e.message); 
        }
    });

    document.getElementById('btn-sync-down').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        const month = document.getElementById('monthSelect').value;
        try {
            const docRef = doc(db, "users", user.uid, "months", month.toString());
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('under26Select').value = data.under26 || "";
                document.getElementById('ppkSelect').value = data.ppk || "";
                document.getElementById('insuranceSelect').value = data.insurance || "";
                document.getElementById('baseSalary').value = data.baseSalary || "5950";
                document.getElementById('bonusPctSelect').value = data.bonusPct || "";
                document.getElementById('morningShifts').value = data.morningShifts || "";
                document.getElementById('nightShifts').value = data.nightShifts || "";
                document.getElementById('weekendDays').value = data.weekendDays || "";
                document.getElementById('overtimeDays').value = data.overtimeDays || "";
                calculateSalary();
                alert(currentLang === 'ua' ? "Дані успішно завантажені з хмари! 📥" : "Dane pomyślnie pobrane z chmury! 📥");
            } else {
                alert(currentLang === 'ua' ? "У хмарі немає збережень за цей місяць." : "W chmurze nie ma danych za ten miesiąc.");
            }
        } catch (e) { alert("Помилка завантаження: " + e.message); }
    });

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.getElementById('themeSelect').value = savedTheme;
    setTheme(savedTheme);
    initMonths();
    loadLocalData();
</script>
</body>
</html>
